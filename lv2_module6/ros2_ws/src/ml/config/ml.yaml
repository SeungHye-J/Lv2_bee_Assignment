# ml 패키지 파라미터 — bringup이 노드에 넘긴다. enabled는 launch 인자 learning_enabled가 덮어쓴다
# (rl_arm_correction은 컨트롤러라 ros_system/config/controllers.yaml)
grasp_scorer:
  ros__parameters:
    enabled: true            # false → 규칙 기반 점수
# rl_nav_controller는 Nav2 controller_server가 plugin으로 로드한다.
#   실제 파라미터는 ros_system/config/nav2_params.yaml의
#   controller_server.ros__parameters.FollowPath.* 에 둔다.
#   (fallback_controller · model_path · extra_lin_vel · extra_ang_vel 포함)
#   이 파일은 ml 패키지의 standalone 노드(grasp_scorer)용이다.
