# ml 패키지 파라미터 — bringup이 노드에 넘긴다. enabled는 launch 인자 learning_enabled가 덮어쓴다
# (rl_arm_correction은 컨트롤러라 ros_system/config/controllers.yaml)
grasp_scorer:
  ros__parameters:
    enabled: true            # false → 규칙 기반 점수
rl_nav_correction:
  ros__parameters:
    enabled: true            # false → Δ=0 (통과만). 서비스 ~/toggle (std_srvs/SetBool)로도 켜고 끔
    # ONNX 정책 — Isaac Lab/rsl_rl 학습. share/ml/model/<노드>/<이름> 하나만 본다 (노드별 폴더로 이름 충돌 방지).
    #   관측 6 = [v_cmd, w_cmd, v_odom, w_odom, w_gyro, t_change] · 출력 2 = [Δv, Δω] (-1..1)
    model_path: "nav_correction/policy.onnx"   # share/ml/model/nav_correction/policy.onnx · "" = 모델 없이 통과
    action_scale_lin: 0.05   # [m/s] 정책 출력 ±1 → Δ 선속도
    action_scale_ang: 0.10   # [rad/s] 정책 출력 ±1 → Δ 각속도
    max_delta_lin: 0.05      # [m/s] Δ 절대 상한 (한 번 더 자름)
    max_delta_ang: 0.10      # [rad/s]
    t_change_max: 2.0        # [s] 관측 t_change 상한 (학습 env와 같게)
    max_vel_x: 0.26          # [m/s] Waffle Pi 최대 선속도 (/speed_limit 백분율의 기준)
    max_vel_theta: 1.82      # [rad/s]
    timeout_s: 0.2           # [s] /odom이 이보다 오래 끊기면 Δ=0
rl_nav_controller:
  ros__parameters:
    # Nav2 FollowPath 플러그인용 ONNX — 같은 네임스페이스 규칙 (share/ml/model/<노드>/<이름>).
    #   실제 값은 ros_system/config/nav2_params.yaml FollowPath.model_path에서 읽는다. 여기는 규격 기록용.
    model_path: "nav_controller/policy.onnx"   # share/ml/model/nav_controller/policy.onnx
