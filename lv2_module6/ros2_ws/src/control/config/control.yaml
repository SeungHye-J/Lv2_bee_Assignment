# control 패키지 파라미터 — bringup이 노드에 넘긴다
# (BeebotSystemHardware 파라미터는 URDF <ros2_control><hardware><param>, 컨트롤러는 ros_system/config/controllers.yaml)
arm_safety_monitor:
  ros__parameters:
    # 접촉 = "거의 멈춘 채 전류만 큼". 움직이는 중 전류(중력·가속)는 정상이라 무시.
    #   실측: 초기 자세 이동 중 joint2 2.12A · joint4 1.99A (정상) — 1.0A로는 팔을 못 움직임
    effort_threshold: 3.0    # [A] 넘으면 접촉 후보 (TODO: 퍽 든 정상 전류 실측 후 관절별)
    hold_s: 0.3              # [s] 기준 초과 + 정지가 이만큼 이어지면 접촉으로 판단
    stall_velocity: 0.10     # [rad/s] 이보다 느리면 "멈춘 것"으로 봄
manual_control:
  ros__parameters:
    arm_joints: [joint1, joint2, joint3, joint4, joint5]
    gripper_joint: gripper_left_joint
    arm_move_s: 1.0          # [s] /cmd/manual/arm 목표까지 걸리는 시간 (JTC 궤적 한 점)
    cmd_timeout_s: 0.5       # [s] 수동 바퀴 명령이 이보다 오래 끊기면 0
