# robot_localization EKF — 바퀴 /odom + /imu 융합 → /odometry/filtered, odom→base_footprint TF
# 설계: documents/project/ros/06-base.md (odom TF는 EKF 하나만, diff_drive_controller는 enable_odom_tf: false)
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    # 주기 진단 카운터 켬 — 끄면(robot_localization 3.10 기본) /odometry/filtered가 50 Hz로 나와도 진단은 "No events recorded"
    #   → TUI·diagnostics가 EKF 오류로 보였음 (실기 11-11: 켠 뒤 Filter diagnostic updater · odometry filtered topic status OK, 49.4 Hz)
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    # 속도 위주로 넣어 미끄러짐 영향을 줄인다 [x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az]
    odom0: /odom
    # 바퀴 vx·vy + yaw 회전속도(11-15부터). 예전(10-19)엔 vyaw를 뺐음: diff_drive 회전속도가 40~90ms 늦고 80초 적분이 5~10° 어긋남
    #   — 그 어긋남의 대부분은 바퀴 간격(유효 0.32 vs 0.287) 차이였음 → controllers.yaml wheel_separation_multiplier 1.12로 맞춘 뒤 넣음.
    #   분산: 바퀴 vyaw 0.01(σ 0.1 rad/s) · IMU 1e-4 — 자이로를 훨씬 더 믿고, 바퀴는 자이로가 튀거나 끊길 때 받쳐 줌
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, true,
                   false, false, false]
    imu0: /imu
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    # cuVSLAM 시각 오도메트리 (cuvslam_slam — 안 나오면 바퀴·IMU만). 바퀴처럼 vx·vy만, yaw는 IMU 그대로
    # 바퀴가 미끄러질 때(제자리 회전·턱) 카메라가 실제 이동을 잡아 줌. 분산은 cuvslam_slam의 linear_variance
    odom1: /cuvslam/odom
    odom1_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, false,
                   false, false, false]
    # TODO(권형중): 실기 공분산·imu0_remove_gravitational_acceleration 등 튜닝
