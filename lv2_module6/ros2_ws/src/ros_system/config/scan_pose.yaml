# 스캔 자세 — 지도 만들 때(RTAB-Map MAPPING · 자동 탐사) 팔을 여기에 고정해 gripper_cam을 차체에 붙은 두 번째 카메라로 씀
#   팔을 낮춰 왼쪽 뒤로: gripper_cam 높이 0.39m · 왼쪽 뒤(방위 150°)를 20° 내려다봄. 팔이 pole_cam 화면에 안 들어감(앞 시야 그대로),
#   폴대·적재함·pole_cam과 4cm 넘게 떨어짐 (URDF FK 탐색 + MoveIt 관절 목표로 충돌 없이 감 — 실측 2026-10-19)
#   ("/**" = 이 파일을 받는 노드 모두: coordinator(그 자세로 보냄) · scan_cam_gate(그 자세일 때만 gripper_cam을 RTAB-Map에 넘김))
/**:
  ros__parameters:
    scan_pose_joints: [joint1, joint2, joint3, joint4, joint5]
    scan_pose: [2.618, 0.681, -1.414, 1.082, 0.0]   # [rad] 150° · 39° · −81° · 62° · 0°
    scan_pose_tolerance: 0.05                       # [rad] 관절마다 이 안이면 스캔 자세
