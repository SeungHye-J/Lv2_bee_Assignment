      joint2: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 5.0}
      joint3: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 5.0}
      joint4: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 5.0}
      joint5: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 5.0}
      gripper_left_joint: {has_velocity_limits: true, max_velocity: 0.07, has_acceleration_limits: true, max_acceleration: 0.5}
      gripper_right_joint: {has_velocity_limits: true, max_velocity: 0.07, has_acceleration_limits: true, max_acceleration: 0.5}
