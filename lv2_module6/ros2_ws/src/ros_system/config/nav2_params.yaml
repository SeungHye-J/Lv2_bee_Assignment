# Nav2 서버 전체 파라미터 — ros_system.launch.py(use_nav2:=true, 기본)가 서버를 직접 띄우며 넘긴다 (nav2_bringup navigation_launch는 안 씀)
# 설계: documents/project/ros/04-nav.md (Nav2) · 06-base.md (속도 체인 · collision_monitor) · API.md §2·§3·§5
# 속도 체인 (API.md:159):
#   controller_server·behavior_server → /cmd_vel_nav → twist_mux(자동) → velocity_smoother
#   → twist_mux → /cmd_vel_mux → velocity_smoother → /cmd_vel_smoothed → collision_monitor → /cmd_vel
# 프레임: base_footprint (Nav2·EKF·MoveIt 통일), odom은 /odometry/filtered (EKF)
# 최상위 키 = 노드 이름. 이름 오타는 오류 없이 무시되고 기본값으로 돈다 → 실기에서 ros2 param get 으로 확인


# ─────────────────────────────────────────────────────────────────────────────
# bt_navigator — 행동 트리(BT)로 "경로 계산 → 따라가기 → 막히면 복구"를 지휘한다.
#   coordinator가 보내는 🎬 /navigate_to_pose 액션을 받는 서버 (API.md §3)
# ─────────────────────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    # 목표 좌표의 기준 프레임. map→odom은 cuVSLAM(cuvslam_slam)이 낸다.
    global_frame: map
    # 로봇 몸의 기준 프레임. controllers.yaml:37 · ekf.yaml:10 과 같아야 한다 (기본값 base_link 아님).
    robot_base_frame: base_footprint
    # 현재 속도를 읽는 토픽. /odom(바퀴만)이 아니라 EKF가 IMU까지 합친 결과.
    odom_topic: /odometry/filtered
    # 목표·현재 자세를 map으로 바꿀 때 TF가 이 시간(초)까지 늦어도 허용. 기본(0.1)이면 부하로 TF가 수십 ms만 늦어도
    #   "Failed to transform end pose to global frame"(102)으로 목표가 취소됐다 (실기 2026-11-11).
    transform_tolerance: 0.5
    # BT를 한 번 tick하는 주기(ms). 10 → 100Hz. 로봇 속도와는 무관하고 configure 때 한 번 읽혀 실행 중 변경 불가.
    bt_loop_duration: 10
    # BT 노드가 액션 서버(planner·controller·behavior)·서비스(is_path_valid)의 응답을 기다리는 시간(ms). Nav2 기본 20.
    #   20이면 부하가 몰릴 때(도커 테스트베드 — perception YOLO·카메라 대역과 함께) 응답이 늦어
    #   'Behavior Tree action client timed out waiting'(error 107)로 goal이 통째로 실패했음 (2026-11-07 A/B 실측)
    #   → 100. 기다리는 시간만 늘 뿐 주행 판단은 같다.
    default_server_timeout: 100
    # BT를 만들 때 BT 노드가 쓰는 서비스(planner_server의 is_path_valid 등)를 기다리는 시간(ms). 기본 1000ms —
    # 기동 직후 부하로 1초 안에 안 보이면 bt_navigator 활성화가 실패해 Nav2 전체가 중단됐음(실측) → 10초
    wait_for_service_timeout: 10000
    # 띄울 내비게이터 목록. CLI 지도 화면은 여러 웨이포인트를 한 번에 보낼 때
    #   /navigate_through_poses를 쓴다 — 중간 웨이포인트마다 액션을 끊지 않아 서지 않는다.
    #   coordinator는 계속 /navigate_to_pose만 쓴다.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      # NavigateToPose 액션을 처리하는 Nav2 플러그인 (이름 고정).
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      # 여러 PoseStamped를 한 경로로 계획·추종한다 (기본 BT: navigate_through_poses_w_replanning_and_recovery.xml).
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 행동 트리 default_nav_to_pose_bt_xml = config/navigate_to_pose.xml — 파일 경로라 ros_system.launch.py가 넘긴다.
    #   기본 BT 복사본에서 복구 후진만 0.30m → 0.10m (pole_front_cam이 뒤를 못 봐서 벽에 박힘, 15-changes #23)


# ─────────────────────────────────────────────────────────────────────────────
# controller_server — /plan(전역 경로)을 따라가는 속도 명령을 만든다.
#   출력 /cmd_vel_nav → twist_mux(자동) (출력 토픽 이름은 yaml이 아니라 launch 리매핑이 정함)
#   노드 이름 /controller_server — Nav2 표준 이름 (예전엔 rl_nav_tuner가 이 파라미터를 바꿨음, 제거됨)
# ─────────────────────────────────────────────────────────────────────────────
controller_server:
  ros__parameters:
    # 경로 끝점을 map으로 바꿀 때 TF 허용 지연(초). bt_navigator와 같은 이유 — 기본(0.1)은 부하 시 너무 짧다.
    transform_tolerance: 0.5
    # 컨트롤러 계산 주기(Hz). /cmd_vel_nav가 이 주기로 나온다 (API.md: 20Hz).
    controller_frequency: 20.0
    # 현재 속도를 읽는 토픽 (EKF 결과). 가속 제한 계산에 쓴다.
    odom_topic: /odometry/filtered
    # 속도 상한 토픽. 현재 발행자 없음 (rl_nav_tuner 제거됨) — 값이 오면 controller_server가 컨트롤러에 전달.
    #   100% 기준 = FollowPath.max_vel_x(0.26). 0이면 제한 없음.
    speed_limit_topic: /speed_limit
    # true면 속도 명령을 TwistStamped로 낸다.
    #   Lyrical diff_drive_controller · twist_mux(use_stamped: true)가 TwistStamped만 받으므로 체인 전체 통일.
    enable_stamped_cmd_vel: true
    # 오도메트리 속도가 이 값보다 작으면 0으로 본다 (센서 잡음 제거). [m/s · rad/s]
    min_x_velocity_threshold: 0.001
    # 차동 구동이라 옆(y) 속도는 없다 → 크게 잡아 사실상 무시.
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 컨트롤러가 유효한 명령을 못 만들어도 이 시간(초)까지는 재시도. 넘으면 FollowPath 실패 → BT 복구.
    #   0.0 = 바로 실패, -1 = 무한 재시도
    failure_tolerance: 0.3
    # 아래 세 목록의 이름은 우리가 짓는 라벨 — 같은 이름의 블록을 찾아 읽는다.
    progress_checker_plugins: ["progress_checker"]
    # general_goal_checker = Nav2 기본 through-poses BT가 찾는 이름. goal_checker와 같은 값으로 둔다.
    goal_checker_plugins: ["goal_checker", "general_goal_checker"]
    # FollowPath는 이름 고정 (예전엔 rl_nav_tuner가 FollowPath.* 를 실행 중 바꿨음, 제거됨).
    controller_plugins: ["FollowPath"]

    # 진행 감시 — 로봇이 "막혔는지" 판단한다 (도착 판단은 goal_checker).
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 이 거리(m) 이상 움직여야 "진행 중"으로 본다. (실측)
      required_movement_radius: 0.3
      # 이 시간(초) 안에 위 거리만큼 못 움직이면 막힘 → 컨트롤러 실패 → BT가 복구(Spin·BackUp·Wait).
      movement_time_allowance: 10.0

    # 도착 판단 — 목표 위치·방향 허용 오차 안에 들어오면 성공.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # true면 위치(xy)를 한 번 만족한 뒤엔 기억하고 방향(yaw)만 맞춘다.
      # false면 매 순간 위치·방향을 둘 다 만족해야 한다 — 허용 오차가 좁으면(0.10) 제자리 회전 중
      #   위치가 살짝 벗어나 도착 판정이 늦어지거나 흔들릴 수 있다.
      # true (2026-11-12): 실기에서 웨이포인트 근처를 빙빙 돌다 105(진행 못 함)가 났다 — 방향 맞추다 위치가 10 cm 밖으로 밀리는 되풀이를 끊는다.
      #   안 나아지면 false로 되돌리고(이 줄만) 위치 흔들림(cuVSLAM 보정 잠금)을 본다.
      stateful: true
      # 목표 위치 허용 오차(m). 퍽 앞 접근 정확도 — 팔 도달 범위가 좁아 기본 0.25보다 작게 (00-overview "도달 범위 주의"). (실측)
      xy_goal_tolerance: 0.10
      # 목표 방향 허용 오차(rad). 0.15 ≈ 8.6°. (실측)
      yaw_goal_tolerance: 0.15
    # through-poses 기본 BT의 GoalCheckerSelector가 찾는 이름 — 값은 goal_checker와 같게.
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true     # goal_checker와 같게 (위 설명)
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15

    # 경로 추종 플러그인 — ml::RlNavController (RL 정책, ONNX) + inner 바이패스
    #   enable=false → inner(MPPI — fallback_controller) 그대로. ~/FollowPath/toggle 서비스로 정책 ON/OFF.
    #   LiDAR가 없어 nvblox 2D ESDF height slice(0.03~0.30 m, 0.05 m voxel)를 360방향 가상 스캔으로 쓴다.
    #   (raw 카메라 점구름은 costmap·collision_monitor가 계속 사용)
    FollowPath:
      plugin: "ml::RlNavController"
      enable: true             # true = ONNX 정책 (모델 없으면 자동 바이패스)
      model_path: "rl_nav_controller/policy.onnx"  # share/ml/model/rl_nav_controller/policy.onnx
      scan_source: "points"    # points(점구름 가상 스캔) | scan(실제 LiDAR)
      points_topic: "/nvblox_node/combined_esdf_pointcloud"  # nvblox 2D ESDF height slice (static+dynamic, PointCloud2)
      points_stride: 1         # height slice 점을 다 쓴다
      esdf_max_distance: 0.20  # [m] ESDF intensity(장애물까지 거리)가 이보다 큰 free 점은 버린다
      z_min: 0.03              # [m] base 기준 — nvblox slice 0.03~0.30 m
      z_max: 0.30
      cloud_timeout: 0.5       # [s] 점구름이 이보다 오래되면 바이패스
      lookahead: 5             # 관측 웨이포인트 개수 (학습과 같게)
      wp_step: 0.30            # [m] 웨이포인트 간격
      wp_scale: 2.0            # 관측 정규화
      lidar_rays: 360          # nvblox 0.05 m voxel / 3.5 m → 1°(360)가 최대 의미 해상도
      lidar_max: 3.5           # [m] 스캔 최대거리 (정규화 기준)
      lidar_inflation: 0.02    # [m] 사용자 안전 여유 — 기본 2 cm (학습 1~5 cm)
      max_lin: 0.26            # [m/s] 정책 출력 ±1 스케일
      max_ang: 1.82            # [rad/s]
      extra_lin_vel: 0.0       # [m/s] 0~0.10 — 정책 출력에 더하는 추가 선속도 (max_lin 상한 유지, 0 = 끄기)
      extra_ang_vel: 0.0       # [rad/s] 0~0.50 — 정책 출력에 더하는 추가 각속도 (max_ang 상한 유지, 0 = 끄기)
      v_min_ratio: -0.2        # 후진 허용 비율 (음수 = 후진)
      # 바이패스 controller — mppi(기본) · dwb · rpp · rotation_shim 또는 전체 pluginlib 클래스명.
      #   처음 쓸 것은 여기서 고르고, 실행 중에는 서비스 /controller_server/FollowPath/set_fallback 으로 바꾼다
      #   (CLI: ./run-cli controller fallback mppi). 각 inner 의 파라미터는 FollowPath.inner_<이름>.* — 아래 블록 하나씩:
      #   inner_dwb(아래) · inner_mppi · inner_rpp · inner_rotation_shim. 안 쓰는 블록은 읽지 않는다.
      #   기본 MPPI (2026-11-11 dwb → mppi). DWB로 돌아가려면 "dwb".
      fallback_controller: "mppi"
      inner_dwb:               # ← DWB 설정 (예전 이름 inner — 바꿔 줌)

        # ── 속도 한계 [m/s · rad/s] — ml.yaml max_vel_x · max_vel_theta와 같은 값
        # 전진 최소 속도. 0이면 경로 추종 중 후진하지 않는다 (pole_front_cam이 뒤를 못 봄).
        min_vel_x: 0.0
        # 전진 최대 속도. Waffle Pi 문서 최대 0.26m/s (바퀴 반경 0.033m · XM430-W350 무부하 약 4.8rad/s).
        #   0.26m/s = 바퀴 약 7.88rad/s ≈ 75rpm. 펌웨어가 rad/s→rpm 변환해 Goal Velocity로 내림. /speed_limit 백분율의 기준.
        max_vel_x: 0.26
        # 차동 구동 — 옆으로 못 가므로 y는 0.
        min_vel_y: 0.0
        max_vel_y: 0.0
        # 최대 회전 속도. 예전 프리셋 A 값 (rl_nav_tuner 제거됨 — 고정값).
        max_vel_theta: 1.82
        # 병진 속도 크기(√(vx²+vy²))의 최소·최대. 차동 구동이라 사실상 vx와 같다.
        min_speed_xy: 0.0
        max_speed_xy: 0.26
        # 회전 속도 크기의 최소. 0 = 하한 없음.
        min_speed_theta: 0.0

        # ── 가속 한계 [m/s² · rad/s²] — 예전 프리셋 A와 같은 값 (rl_nav_tuner 제거됨 — 고정값).
        # 전진 가속·감속.
        acc_lim_x: 2.5
        decel_lim_x: -2.5
        # 옆 방향 — 차동 구동이라 0.
        acc_lim_y: 0.0
        decel_lim_y: 0.0
        # 회전 가속·감속.
        acc_lim_theta: 3.2
        decel_lim_theta: -3.2

        # ── 궤적 샘플링 — 몇 개의 속도 후보를 얼마나 멀리 그려 볼지
        # 선속도 후보 개수. 많을수록 정밀하지만 계산이 무겁다.
        vx_samples: 20
        # 옆 속도 후보 개수. y를 안 쓰므로 1.
        vy_samples: 1
        # 회전 속도 후보 개수.
        vtheta_samples: 20
        # 각 후보 궤적을 몇 초 앞까지 그려 볼지. 좁은 미로라 너무 길면 먼 벽에 걸려 후보가 다 탈락한다. (실측)
        sim_time: 1.5
        # 궤적 위 충돌 검사 간격 — 직선(m) · 회전(rad). 작을수록 촘촘하게 검사.
        linear_granularity: 0.05
        angular_granularity: 0.025
        # TF가 이 시간(초)까지 늦어도 허용.
        transform_tolerance: 0.2
        # critics가 "목표 근처"를 판단하는 거리. goal_checker의 xy_goal_tolerance와 같게.
        xy_goal_tolerance: 0.10
        # 이 속도(m/s)보다 느리면 "멈춘 상태"로 본다 (RotateToGoal이 제자리 회전을 시작하는 조건).
        trans_stopped_velocity: 0.25
        # 이미 최고점보다 나빠진 후보는 남은 critic 계산을 건너뛴다 (계산 절약).
        short_circuit_trajectory_evaluation: true
        # true면 목표 근처에서 "회전 단계"에 들어간 상태를 기억해, 다시 전진으로 돌아가며 흔들리지 않게 한다.
        stateful: true

        # ── 평가 기준(critics) — 후보 궤적마다 점수를 매겨 합이 가장 좋은 것을 고른다.
        #   가중치(.scale)는 실행 중에 바꾸지 않는다 — 초기화 때만 읽힐 수 있음 (15-changes #2)
        #   RotateToGoal : 목표 근처에서 목표 방향으로 제자리 회전
        #   Oscillation  : 앞뒤·좌우로 왔다 갔다 하는 궤적에 벌점
        #   BaseObstacle : costmap 비용이 높은(벽·장애물 가까운) 곳을 지나는 궤적에 벌점
        #   GoalAlign    : 로봇 앞쪽이 목표를 향하도록
        #   PathAlign    : 로봇 방향이 경로 방향과 나란하도록
        #   PathDist     : 경로에서 멀어지는 궤적에 벌점
        #   GoalDist     : 목표까지 거리를 줄이는 궤적을 선호
        critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
        # 장애물 벌점 가중치. 작게 두고 inflation(costmap)으로 벽과 거리를 확보한다.
        BaseObstacle.scale: 0.02
        # 경로 방향 정렬 가중치. forward_point_distance = 로봇 앞 몇 m 지점으로 정렬을 계산할지.
        PathAlign.scale: 32.0
        PathAlign.forward_point_distance: 0.1
        # 목표 방향 정렬 가중치.
        GoalAlign.scale: 24.0
        GoalAlign.forward_point_distance: 0.1
        # 경로 이탈 벌점 가중치. 미로에서는 경로를 꼭 붙어 가야 하므로 크게.
        PathDist.scale: 32.0
        # 목표 접근 가중치.
        GoalDist.scale: 24.0
        # 목표 근처 회전 가중치.
        RotateToGoal.scale: 32.0
        # 회전 단계에 들어가기 전 감속 정도. 클수록 일찍·많이 감속.
        RotateToGoal.slowing_factor: 5.0
        # 미래 위치로 회전 시작 시점을 미리 판단할 시간(초). -1 = 사용 안 함 (현재 위치로 판단).
        RotateToGoal.lookahead_time: -1.0

      # ── MPPI (nav2_mppi_controller) — Nav2 Lyrical 기준 yaml 형식(motion_model: "diff_drive" + 플러그인 블록).
      #   CPU 연산이 무겁다 (batch_size × time_steps 궤적을 20 Hz로 샘플링). Orin Nano는 이미 부하가 높아 가볍게 시작 —
      #   기본(2000 × 56)의 절반 이하. 로봇 한계는 DWB·velocity_smoother와 같게 (vx 0.26 · wz 1.82 · 가속 2.5/3.2).
      #   ⚠ 값은 Lyrical 기준 yaml에서 가져와 로봇 한계에 맞춘 것이고 실기 튜닝 전이다.
      inner_mppi:
        time_steps: 40
        model_dt: 0.05
        batch_size: 800
        iteration_count: 1
        temperature: 0.3
        gamma: 0.015
        visualize: false
        publish_optimal_trajectory: false
        regenerate_noises: true
        open_loop: false
        ax_max: 2.5
        ax_min: -2.5
        ay_max: 0.0
        ay_min: 0.0
        az_max: 3.2
        vx_std: 0.1
        vy_std: 0.1
        wz_std: 0.3
        vx_max: 0.26
        vx_min: 0.0              # 후진 안 함 (DWB min_vel_x와 같게 — pole_front_cam이 뒤를 못 봄)
        vy_max: 0.0
        wz_max: 1.82
        motion_model: "diff_drive"
        diff_drive:
          plugin: "mppi::DiffDriveMotionModel"
        TrajectoryValidator:
          plugin: "mppi::DefaultOptimalTrajectoryValidator"
          collision_lookahead_time: 1.5
          consider_footprint: true   # 직사각형 몸으로 궤적 충돌 검사 (원이면 뒤 0.13 m를 못 봄)
        critics:
          ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
           "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
        ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
        GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.0}
        GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
        PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.5}
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.81
          near_collision_cost: 253
          critical_cost: 300.0
          consider_footprint: true   # 직사각형 몸 (inflation_radius ≥ 외접 반경이어야 함 — local_costmap 참고)
          collision_cost: 1000000.0
          near_goal_distance: 0.5
          trajectory_point_step: 2
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 14.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 5, threshold_to_consider: 1.0}
        PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 2.0, offset_from_furthest: 4, threshold_to_consider: 0.5}

      # ── RPP (nav2_regulated_pure_pursuit_controller) — 경로를 따라 앞쪽 점(lookahead)을 쫓는 단순 추종. 가볍다.
      #   파라미터 이름은 설치된 Lyrical 라이브러리에서 확인 (desired_linear_vel · lookahead_* · rotate_to_heading_*).
      #   use_rotate_to_heading 과 allow_reversing 은 동시에 true 일 수 없다 (후진 안 함 → rotate_to_heading 사용).
      inner_rpp:
        desired_linear_vel: 0.20
        lookahead_dist: 0.40
        min_lookahead_dist: 0.20
        max_lookahead_dist: 0.80
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: false
        rotate_to_heading_angular_vel: 1.0
        rotate_to_heading_min_angle: 0.785
        use_rotate_to_heading: true
        allow_reversing: false
        max_angular_accel: 3.2
        regulated_linear_scaling_min_speed: 0.05

      # ── RotationShim (nav2_rotation_shim_controller) — 목표 방향이 많이 틀어져 있으면 먼저 제자리에서 돌고, 그 뒤 primary 에 넘김.
      #   primary 의 파라미터는 반드시 primary_controller: 아래 (Kilted 이후 네임스페이스 필수). 여기서는 RPP 를 primary 로.
      inner_rotation_shim:
        angular_dist_threshold: 0.785
        angular_disengage_threshold: 0.3925
        forward_sampling_distance: 0.5
        rotate_to_heading_angular_vel: 1.0
        max_angular_accel: 3.2
        simulate_ahead_time: 1.0
        rotate_to_goal_heading: false
        rotate_to_heading_once: false
        primary_controller:
          plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
          desired_linear_vel: 0.20
          lookahead_dist: 0.40
          min_lookahead_dist: 0.20
          max_lookahead_dist: 0.80
          lookahead_time: 1.5
          use_velocity_scaled_lookahead_dist: false
          use_rotate_to_heading: false
          allow_reversing: false
          regulated_linear_scaling_min_speed: 0.05


# ═════════════════════════════════════════════════════════════════════════════
# 아래는 진짜 Nav2를 faker·시뮬레이터에서도 돌리려고 채운 나머지 서버 (위 두 블록은 feature/nav2-params-config 그대로).
# ros_system.launch.py가 서버를 직접 띄우고 관리자 둘이 올린다 (맨 아래):
#   lifecycle_manager_base: velocity_smoother · collision_monitor (바퀴 명령 체인 — 지도 없이도)
#   lifecycle_manager_navigation: planner_server · controller_server · behavior_server · bt_navigator (map 필요)
# 센서: pole_front_cam 점구름(/pole_front_cam/depth/color/points, 하향 RealSense → body_filter가 자기 몸 점을 뺀 points_filtered) 하나 — LiDAR 없음
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# planner_server — map 위 전역 경로(/plan). SmacPlanner2D — NavFn과 달리 footprint(로봇 몸) 충돌을 검사한다.
#   NavFn은 로봇을 점으로 보고 팽창 비용만 보므로 벽 모서리에 몸을 붙여 지나갔다 (실측).
#   이름 GridBased = 기본 BT(navigate_to_pose_w_replanning_and_recovery)가 부르는 planner_id
# ─────────────────────────────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      # 목표가 벽·팽창 영역 안이면 이 거리(m)까지 가까운 빈 곳으로 대신 감 (퍽 앞 접근 자세가 벽에 붙을 때)
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      use_final_approach_orientation: false


# ─────────────────────────────────────────────────────────────────────────────
# behavior_server — BT 복구 동작 (Spin · BackUp · Wait). 출력은 controller와 같은 /cmd_vel_nav (launch 리매핑)
# ─────────────────────────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: true


# ─────────────────────────────────────────────────────────────────────────────
# local_costmap — 로봇 주변 3×3m (odom 기준, 굴러감). controller(DWB)가 장애물 회피에 씀.
#   VoxelLayer: pole_front_cam 점구름에서 바닥(0.03m 아래)은 버리고 0.6m까지를 장애물로 — 퍽(높이 3~5cm)도 장애물로 잡힘
# ─────────────────────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      # 활성화할 때 base_footprint→map/odom TF를 기다리는 시간(초). 기본 60초 안에 안 오면 Nav2 전체 기동이 중단된다 —
      # 바퀴 컨트롤러(odom TF)가 기동 부하로 늦게 떠도 버티게 길게 (실기 부팅·테스트베드 공통)
      initial_transform_timeout: 300.0
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 로봇 외곽 = 실제 몸 직사각형 (base_footprint 기준 [m]: 앞 0.069 · 뒤 -0.245 · 옆 ±0.151 — beebot.usda 충돌 도형,
      #   faker/config/robot_footprint.yaml과 같은 값). 기준점이 앞 바퀴축 쪽이라 몸이 뒤로 길다 → 원(0.16)은 뒤를 0.13 m 덜 봐서
      #   경로가 벽에 붙고 제자리 회전 때 뒤가 벽에 걸렸다 (테스트베드 실측 2026-11-11: 105 반복·Spin "Collision Ahead").
      footprint: "[[0.069, 0.151], [0.069, -0.151], [-0.245, -0.151], [-0.245, 0.151]]"
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.6
        mark_threshold: 0
        observation_sources: pole_front_cam
        pole_front_cam:
          topic: /pole_front_cam/depth/color/points_filtered   # perception/body_filter가 자기 몸(팔·차체) 점을 뺀 것
          data_type: "PointCloud2"
          min_obstacle_height: 0.03
          max_obstacle_height: 0.6
          marking: true
          clearing: true
          obstacle_min_range: 0.2
          obstacle_max_range: 2.5
          raytrace_min_range: 0.2
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 직사각형 footprint의 외접 반경(≈0.30, 패딩 포함) 이상이어야 MPPI가 몸 모양으로 충돌을 본다 (작으면 경고 + 원으로 봄).
        # 6.0 = 벽에서 0.3 m면 비용 약 1/4 — 통로 가운데를 고르되 좁은 곳(절반 폭 0.25)도 지나가게
        inflation_radius: 0.35
        cost_scaling_factor: 6.0


# ─────────────────────────────────────────────────────────────────────────────
# global_costmap — map 전체. 정지 지도(/map: 실기 SLAM · 시뮬레이터 map_server) + pole_front_cam 장애물
# ─────────────────────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      # 활성화할 때 base_footprint→map/odom TF를 기다리는 시간(초). 기본 60초 안에 안 오면 Nav2 전체 기동이 중단된다 —
      # 바퀴 컨트롤러(odom TF)가 기동 부하로 늦게 떠도 버티게 길게 (실기 부팅·테스트베드 공통)
      initial_transform_timeout: 300.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # 로봇 외곽 = 실제 몸 직사각형 (base_footprint 기준 [m]: 앞 0.069 · 뒤 -0.245 · 옆 ±0.151 — beebot.usda 충돌 도형,
      #   faker/config/robot_footprint.yaml과 같은 값). 기준점이 앞 바퀴축 쪽이라 몸이 뒤로 길다 → 원(0.16)은 뒤를 0.13 m 덜 봐서
      #   경로가 벽에 붙고 제자리 회전 때 뒤가 벽에 걸렸다 (테스트베드 실측 2026-11-11: 105 반복·Spin "Collision Ahead").
      footprint: "[[0.069, 0.151], [0.069, -0.151], [-0.245, -0.151], [-0.245, 0.151]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      # 전역 계획: 정적 벽 + 작은 팽창만 — 동적 장애물은 local costmap/DWB·ONNX ESDF가 맡는다.
      # (obstacle_layer까지 넣으면 전역 계획이 동적 장애물에 민감해져 좁은 통로에서 자주 실패)
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pole_front_cam
        pole_front_cam:
          topic: /pole_front_cam/depth/color/points_filtered   # perception/body_filter가 자기 몸(팔·차체) 점을 뺀 것
          data_type: "PointCloud2"
          min_obstacle_height: 0.03
          max_obstacle_height: 0.6
          marking: true
          clearing: true
          obstacle_min_range: 0.2
          obstacle_max_range: 2.5
          raytrace_min_range: 0.2
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 전역 계획(NavFn)은 로봇을 점으로 본다 — 몸 안쪽 반경(앞 0.08)까지만 막히니, 비용으로 통로 가운데를 고르게 한다.
        # 0.45 · 6.0: 벽에서 0.3 m ≈ 67 · 0.15 m ≈ 166 (253 = 몸이 닿음) — 제자리 회전 반경(뒤 모서리 0.29)을 지키는 경로
        inflation_radius: 0.45
        cost_scaling_factor: 6.0


# ─────────────────────────────────────────────────────────────────────────────
# velocity_smoother — twist_mux 출력(/cmd_vel_mux)의 가속을 다듬어 /cmd_vel_smoothed (launch 리매핑)
#   한계는 FollowPath(프리셋 A)와 같게
# ─────────────────────────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.82]
    min_velocity: [-0.26, 0.0, -1.82]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # 입력이 이 시간(초) 끊기면 0으로
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true


# ─────────────────────────────────────────────────────────────────────────────
# collision_monitor — 맨 마지막 안전장치: /cmd_vel_smoothed → /cmd_vel. pole_front_cam 점구름 기준 부딪힐 방향만 멈춤(approach) · 가까우면 감속.
#   twist_mux(자동·수동)까지 다 거친 최종 명령을 거른다 (00-overview "안전장치는 학습 노드보다 뒤")
#   source_timeout: 점구름이 이만큼 안 오면 정지 — 카메라 끊김 = 멈춤
# ─────────────────────────────────────────────────────────────────────────────
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: true
    polygons: ["Approach", "SlowZone"]
    # approach: 지금 속도로 계속 가면 time_before_collision 안에 몸에 점이 닿는 경우에만 그 속도를 줄여 멈춤.
    #   ⚠ Nav2는 점이 이미 영역 안에 있으면 방향과 상관없이 충돌 시간 0 → 전부 정지 (polygon.cpp getCollisionTime).
    #     예전엔 몸 둘레 원(0.20) 하나라 벽에 다가가 멈춘 뒤 깊이 잡음으로 점이 원 안에 들면 후진·회전까지 막혀
    #     복구(BackUp·Spin)가 못 움직이고 계획이 파기됐다 (2026-11-11 실기 증상).
    #   그래서 velocity_polygon — 지금 명령 속도에 따라 영역을 고른다 (첫 번째로 맞는 것):
    #     forward  (vx > 0)  몸 앞 반원 0.20 — 앞의 벽만 전진을 막는다
    #     backward (vx < 0)  몸 뒤 반원 0.20 — 앞 카메라 점은 여기 없으니 후진은 막히지 않는다 (뒤는 못 봄)
    #     rotate   (vx ≈ 0)  몸 크기 원 0.18 — 실제로 닿은 점만 제자리 회전을 막는다
    Approach:
      type: "velocity_polygon"
      action_type: "approach"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_approach
      enabled: true
      holonomic: false
      velocity_polygons: ["rotate", "forward", "backward"]
      rotate:
        points: "[[0.18, 0], [0.174, 0.047], [0.156, 0.09], [0.127, 0.127], [0.09, 0.156], [0.047, 0.174], [0, 0.18], [-0.047, 0.174], [-0.09, 0.156], [-0.127, 0.127], [-0.156, 0.09], [-0.174, 0.047], [-0.18, 0], [-0.174, -0.047], [-0.156, -0.09], [-0.127, -0.127], [-0.09, -0.156], [-0.047, -0.174], [0, -0.18], [0.047, -0.174], [0.09, -0.156], [0.127, -0.127], [0.156, -0.09], [0.174, -0.047]]"
        linear_min: -0.005
        linear_max: 0.005
        theta_min: -10.0
        theta_max: 10.0
      forward:
        points: "[[0, -0.2], [0.052, -0.193], [0.1, -0.173], [0.141, -0.141], [0.173, -0.1], [0.193, -0.052], [0.2, 0], [0.193, 0.052], [0.173, 0.1], [0.141, 0.141], [0.1, 0.173], [0.052, 0.193], [0, 0.2]]"
        linear_min: 0.005
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
      backward:
        points: "[[0, 0.2], [-0.052, 0.193], [-0.1, 0.173], [-0.141, 0.141], [-0.173, 0.1], [-0.193, 0.052], [-0.2, 0], [-0.193, -0.052], [-0.173, -0.1], [-0.141, -0.141], [-0.1, -0.173], [-0.052, -0.193], [0, -0.2]]"
        linear_min: -10.0
        linear_max: -0.005
        theta_min: -10.0
        theta_max: 10.0
    # 0.30m 안이면 절반 속도 (통로 가운데면 벽까지 약 0.37m라 평소엔 안 걸림)
    SlowZone:
      type: "circle"
      radius: 0.30
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true
    observation_sources: ["pole_front_cam"]
    pole_front_cam:
      type: "pointcloud"
      topic: /pole_front_cam/depth/color/points_filtered   # perception/body_filter가 자기 몸(팔·차체) 점을 뺀 것
      min_height: 0.05
      max_height: 0.6
      enabled: true


# ─────────────────────────────────────────────────────────────────────────────
# lifecycle 관리자 — 맡은 서버를 순서대로 configure·activate (하나라도 실패하면 그 관리자 것만 중단)
#   둘로 나눈 이유: 하나로 묶으면 SLAM이 아직 map→odom을 못 낼 때 global_costmap 실패로 바퀴 명령 체인까지
#   inactive → 수동 조작(→ twist_mux → velocity_smoother → collision_monitor)도 막힘 (실측, map:=slam)
#   bond_timeout: 활성화한 서버와 이 시간(초) 안에 bond(생존 신호)가 이어지지 않으면 중단.
#     기동 직후 CPU가 몰리면(진짜 Nav2 + 컨트롤러 + 인지) 10초 안에 신호가 늦게 와서 중단됐음(실측) → 여유 있게
# ─────────────────────────────────────────────────────────────────────────────
lifecycle_manager_base:          # 바퀴 명령 체인 — odom TF만 있으면 뜸
  ros__parameters:
    autostart: true
    bond_timeout: 60.0
    node_names: ["velocity_smoother", "collision_monitor"]

lifecycle_manager_navigation:    # 주행 계획 — map(→odom) 필요
  ros__parameters:
    autostart: true
    bond_timeout: 60.0
    node_names: ["planner_server", "controller_server", "behavior_server", "bt_navigator"]
