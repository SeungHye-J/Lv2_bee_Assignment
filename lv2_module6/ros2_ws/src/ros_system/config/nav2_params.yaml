# Nav2 서버 전체 파라미터 — ros_system.launch.py(use_nav2:=true, 기본)가 서버를 직접 띄우며 넘긴다 (nav2_bringup navigation_launch는 안 씀)
# 설계: documents/ros2-design/04-nav.md (Nav2) · 06-base.md (속도 체인 · collision_monitor) · API.md §2·§3·§5
# 속도 체인 (API.md:159):
#   controller_server·behavior_server → /cmd_vel_nav → rl_nav_correction → /cmd_vel_corrected
#   → twist_mux → /cmd_vel_mux → velocity_smoother → /cmd_vel_smoothed → collision_monitor → /cmd_vel
# 프레임: base_footprint (Nav2·EKF·MoveIt 통일), odom은 /odometry/filtered (EKF)
# 최상위 키 = 노드 이름. 이름 오타는 오류 없이 무시되고 기본값으로 돈다 → 실기에서 ros2 param get 으로 확인


# ─────────────────────────────────────────────────────────────────────────────
# bt_navigator — 행동 트리(BT)로 "경로 계산 → 따라가기 → 막히면 복구"를 지휘한다.
#   coordinator가 보내는 🎬 /navigate_to_pose 액션을 받는 서버 (API.md §3)
# ─────────────────────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    # 목표 좌표의 기준 프레임. map→odom은 rtabmap(위치추정 모드)이 낸다.
    global_frame: map
    # 로봇 몸의 기준 프레임. controllers.yaml:37 · ekf.yaml:10 과 같아야 한다 (기본값 base_link 아님).
    robot_base_frame: base_footprint
    # 현재 속도를 읽는 토픽. /odom(바퀴만)이 아니라 EKF가 IMU까지 합친 결과.
    odom_topic: /odometry/filtered
    # BT를 한 번 tick하는 주기(ms). 10 → 100Hz. 로봇 속도와는 무관하고 configure 때 한 번 읽혀 실행 중 변경 불가.
    bt_loop_duration: 10
    # BT 노드가 액션 서버(planner·controller·behavior)를 기다리는 기본 시간(ms).
    default_server_timeout: 20
    # BT를 만들 때 BT 노드가 쓰는 서비스(planner_server의 is_path_valid 등)를 기다리는 시간(ms). 기본 1000ms —
    # 기동 직후 부하로 1초 안에 안 보이면 bt_navigator 활성화가 실패해 Nav2 전체가 중단됐음(실측) → 10초
    wait_for_service_timeout: 10000
    # 띄울 내비게이터 목록. coordinator는 navigate_to_pose만 쓴다 (navigate_through_poses는 뺌).
    #   이름은 기본값 그대로 — 액션 이름 /navigate_to_pose와 연결된다.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      # NavigateToPose 액션을 처리하는 Nav2 플러그인 (이름 고정).
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # 행동 트리 default_nav_to_pose_bt_xml = config/navigate_to_pose.xml — 파일 경로라 ros_system.launch.py가 넘긴다.
    #   기본 BT 복사본에서 복구 후진만 0.30m → 0.10m (pole_cam이 뒤를 못 봐서 벽에 박힘, 15-changes #23)


# ─────────────────────────────────────────────────────────────────────────────
# controller_server — /plan(전역 경로)을 따라가는 속도 명령을 만든다.
#   출력 /cmd_vel_nav → rl_nav_correction (출력 토픽 이름은 yaml이 아니라 launch 리매핑이 정함)
#   노드 이름 /controller_server 는 rl_nav_tuner.cpp:27 이 파라미터를 바꾸려고 부르는 이름
# ─────────────────────────────────────────────────────────────────────────────
controller_server:
  ros__parameters:
    # 컨트롤러 계산 주기(Hz). /cmd_vel_nav가 이 주기로 나온다 (API.md: 20Hz).
    controller_frequency: 20.0
    # 현재 속도를 읽는 토픽 (EKF 결과). 가속 제한 계산에 쓴다.
    odom_topic: /odometry/filtered
    # 속도 상한 토픽. rl_nav_tuner(rl_nav_tuner.cpp:26)가 프리셋마다 백분율(%)로 보낸다.
    #   100% 기준 = FollowPath.max_vel_x(0.26). 0이면 제한 없음.
    speed_limit_topic: /speed_limit
    # true면 속도 명령을 TwistStamped로 낸다.
    #   Lyrical diff_drive_controller · twist_mux(use_stamped: true)가 TwistStamped만 받으므로 체인 전체 통일.
    enable_stamped_cmd_vel: true
    # 오도메트리 속도가 이 값보다 작으면 0으로 본다 (센서 잡음 제거). [m/s · rad/s]
    min_x_velocity_threshold: 0.001
    # 차동 구동이라 옆(y) 속도는 없다 → 크게 잡아 사실상 무시.
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 컨트롤러가 유효한 명령을 못 만들어도 이 시간(초)까지는 재시도. 넘으면 FollowPath 실패 → BT 복구.
    #   0.0 = 바로 실패, -1 = 무한 재시도
    failure_tolerance: 0.3
    # 아래 세 목록의 이름은 우리가 짓는 라벨 — 같은 이름의 블록을 찾아 읽는다.
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    # FollowPath는 이름 고정: rl_nav_tuner.cpp:64~66 이 FollowPath.* 를 바꾼다.
    controller_plugins: ["FollowPath"]

    # 진행 감시 — 로봇이 "막혔는지" 판단한다 (도착 판단은 goal_checker).
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 이 거리(m) 이상 움직여야 "진행 중"으로 본다. (실측)
      required_movement_radius: 0.3
      # 이 시간(초) 안에 위 거리만큼 못 움직이면 막힘 → 컨트롤러 실패 → BT가 복구(Spin·BackUp·Wait).
      movement_time_allowance: 10.0

    # 도착 판단 — 목표 위치·방향 허용 오차 안에 들어오면 성공.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # true면 위치(xy)를 한 번 만족한 뒤엔 기억하고 방향(yaw)만 맞춘다.
      # false면 매 순간 위치·방향을 둘 다 만족해야 한다 — 허용 오차가 좁으면(0.10) 제자리 회전 중
      #   위치가 살짝 벗어나 도착 판정이 늦어지거나 흔들릴 수 있다. 실기에서 보고 true로 바꿀지 결정.
      stateful: false
      # 목표 위치 허용 오차(m). 퍽 앞 접근 정확도 — 팔 도달 범위가 좁아 기본 0.25보다 작게 (00-overview "도달 범위 주의"). (실측)
      xy_goal_tolerance: 0.10
      # 목표 방향 허용 오차(rad). 0.15 ≈ 8.6°. (실측)
      yaw_goal_tolerance: 0.15

    # 경로 추종 플러그인 — DWB(Dynamic Window Approach).
    #   여러 속도 후보로 짧은 미래 궤적을 그려 보고, critics 점수가 가장 좋은 속도를 고른다.
    #   DWB여야 acc_lim_x·decel_lim_x 이름이 존재한다 (Jazzy 기본 파일은 MPPI — 이름이 달라 tuner가 실패).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # ── 속도 한계 [m/s · rad/s] — ml.yaml rl_nav_correction(max_vel_x · max_vel_theta)과 같은 값
      # 전진 최소 속도. 0이면 경로 추종 중 후진하지 않는다 (pole_cam이 뒤를 못 봄).
      min_vel_x: 0.0
      # 전진 최대 속도. Waffle Pi 최대 0.26. /speed_limit 백분율의 기준.
      max_vel_x: 0.26
      # 차동 구동 — 옆으로 못 가므로 y는 0.
      min_vel_y: 0.0
      max_vel_y: 0.0
      # 최대 회전 속도. 프리셋 A 값 — rl_nav_tuner가 실행 중 1.82/1.0/0.8로 바꾼다.
      max_vel_theta: 1.82
      # 병진 속도 크기(√(vx²+vy²))의 최소·최대. 차동 구동이라 사실상 vx와 같다.
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      # 회전 속도 크기의 최소. 0 = 하한 없음.
      min_speed_theta: 0.0

      # ── 가속 한계 [m/s² · rad/s²] — 프리셋 A와 같은 값 (rl_nav_tuner.cpp:10)
      #   tuner를 꺼도(enabled:=false → 프리셋 A) 원래 시스템과 같아야 하므로 일치시킨다.
      # 전진 가속·감속. rl_nav_tuner가 실행 중 바꾼다.
      acc_lim_x: 2.5
      decel_lim_x: -2.5
      # 옆 방향 — 차동 구동이라 0.
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      # 회전 가속·감속.
      acc_lim_theta: 3.2
      decel_lim_theta: -3.2

      # ── 궤적 샘플링 — 몇 개의 속도 후보를 얼마나 멀리 그려 볼지
      # 선속도 후보 개수. 많을수록 정밀하지만 계산이 무겁다.
      vx_samples: 20
      # 옆 속도 후보 개수. y를 안 쓰므로 1.
      vy_samples: 1
      # 회전 속도 후보 개수.
      vtheta_samples: 20
      # 각 후보 궤적을 몇 초 앞까지 그려 볼지. 좁은 미로라 너무 길면 먼 벽에 걸려 후보가 다 탈락한다. (실측)
      sim_time: 1.5
      # 궤적 위 충돌 검사 간격 — 직선(m) · 회전(rad). 작을수록 촘촘하게 검사.
      linear_granularity: 0.05
      angular_granularity: 0.025
      # TF가 이 시간(초)까지 늦어도 허용.
      transform_tolerance: 0.2
      # critics가 "목표 근처"를 판단하는 거리. goal_checker의 xy_goal_tolerance와 같게.
      xy_goal_tolerance: 0.10
      # 이 속도(m/s)보다 느리면 "멈춘 상태"로 본다 (RotateToGoal이 제자리 회전을 시작하는 조건).
      trans_stopped_velocity: 0.25
      # 이미 최고점보다 나빠진 후보는 남은 critic 계산을 건너뛴다 (계산 절약).
      short_circuit_trajectory_evaluation: true
      # true면 목표 근처에서 "회전 단계"에 들어간 상태를 기억해, 다시 전진으로 돌아가며 흔들리지 않게 한다.
      stateful: true

      # ── 평가 기준(critics) — 후보 궤적마다 점수를 매겨 합이 가장 좋은 것을 고른다.
      #   가중치(.scale)는 실행 중에 바꾸지 않는다 — 초기화 때만 읽힐 수 있음 (15-changes #2)
      #   RotateToGoal : 목표 근처에서 목표 방향으로 제자리 회전
      #   Oscillation  : 앞뒤·좌우로 왔다 갔다 하는 궤적에 벌점
      #   BaseObstacle : costmap 비용이 높은(벽·장애물 가까운) 곳을 지나는 궤적에 벌점
      #   GoalAlign    : 로봇 앞쪽이 목표를 향하도록
      #   PathAlign    : 로봇 방향이 경로 방향과 나란하도록
      #   PathDist     : 경로에서 멀어지는 궤적에 벌점
      #   GoalDist     : 목표까지 거리를 줄이는 궤적을 선호
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # 장애물 벌점 가중치. 작게 두고 inflation(costmap)으로 벽과 거리를 확보한다.
      BaseObstacle.scale: 0.02
      # 경로 방향 정렬 가중치. forward_point_distance = 로봇 앞 몇 m 지점으로 정렬을 계산할지.
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      # 목표 방향 정렬 가중치.
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      # 경로 이탈 벌점 가중치. 미로에서는 경로를 꼭 붙어 가야 하므로 크게.
      PathDist.scale: 32.0
      # 목표 접근 가중치.
      GoalDist.scale: 24.0
      # 목표 근처 회전 가중치.
      RotateToGoal.scale: 32.0
      # 회전 단계에 들어가기 전 감속 정도. 클수록 일찍·많이 감속.
      RotateToGoal.slowing_factor: 5.0
      # 미래 위치로 회전 시작 시점을 미리 판단할 시간(초). -1 = 사용 안 함 (현재 위치로 판단).
      RotateToGoal.lookahead_time: -1.0


# ═════════════════════════════════════════════════════════════════════════════
# 아래는 진짜 Nav2를 faker·시뮬레이터에서도 돌리려고 채운 나머지 서버 (위 두 블록은 feature/nav2-params-config 그대로).
# ros_system.launch.py가 서버를 직접 띄우고 관리자 둘이 올린다 (맨 아래):
#   lifecycle_manager_base: velocity_smoother · collision_monitor (바퀴 명령 체인 — 지도 없이도)
#   lifecycle_manager_navigation: planner_server · controller_server · behavior_server · bt_navigator (map 필요)
# 센서: pole_cam 점구름(/pole_cam/depth/color/points, 하향 RealSense → body_filter가 자기 몸 점을 뺀 points_filtered) 하나 — LiDAR 없음
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# planner_server — map 위 전역 경로(/plan). 미로 칸 단위라 NavFn(Dijkstra)이면 충분.
#   이름 GridBased = 기본 BT(navigate_to_pose_w_replanning_and_recovery)가 부르는 planner_id
# ─────────────────────────────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # 목표가 벽·팽창 영역 안이면 이 거리(m)까지 가까운 빈 곳으로 대신 감 (퍽 앞 접근 자세가 벽에 붙을 때)
      tolerance: 0.20
      use_astar: false
      allow_unknown: true


# ─────────────────────────────────────────────────────────────────────────────
# behavior_server — BT 복구 동작 (Spin · BackUp · Wait). 출력은 controller와 같은 /cmd_vel_nav (launch 리매핑)
# ─────────────────────────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: true


# ─────────────────────────────────────────────────────────────────────────────
# local_costmap — 로봇 주변 3×3m (odom 기준, 굴러감). controller(DWB)가 장애물 회피에 씀.
#   VoxelLayer: pole_cam 점구름에서 바닥(0.03m 아래)은 버리고 0.6m까지를 장애물로 — 퍽(높이 3~5cm)도 장애물로 잡힘
# ─────────────────────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      # 활성화할 때 base_footprint→map/odom TF를 기다리는 시간(초). 기본 60초 안에 안 오면 Nav2 전체 기동이 중단된다 —
      # 바퀴 컨트롤러(odom TF)가 기동 부하로 늦게 떠도 버티게 길게 (실기 부팅·테스트베드 공통)
      initial_transform_timeout: 300.0
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 로봇 외곽 반경 (Waffle 폭 0.306 + 상판·팔) — 시뮬레이터 plant.ROBOT_R과 같게
      robot_radius: 0.18
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.6
        mark_threshold: 0
        observation_sources: pole_cam
        pole_cam:
          topic: /pole_cam/depth/color/points_filtered   # control/body_filter가 자기 몸(팔·차체) 점을 뺀 것
          data_type: "PointCloud2"
          min_obstacle_height: 0.03
          max_obstacle_height: 0.6
          marking: true
          clearing: true
          obstacle_min_range: 0.2
          obstacle_max_range: 2.5
          raytrace_min_range: 0.2
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 통로 0.73m − 로봇 지름 0.36m → 양쪽 여유 약 0.18m. 팽창이 통로를 다 덮지 않게 작게
        inflation_radius: 0.25
        cost_scaling_factor: 8.0


# ─────────────────────────────────────────────────────────────────────────────
# global_costmap — map 전체. 정지 지도(/map: 실기 RTAB-Map · 시뮬레이터 map_server) + pole_cam 장애물
# ─────────────────────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      # 활성화할 때 base_footprint→map/odom TF를 기다리는 시간(초). 기본 60초 안에 안 오면 Nav2 전체 기동이 중단된다 —
      # 바퀴 컨트롤러(odom TF)가 기동 부하로 늦게 떠도 버티게 길게 (실기 부팅·테스트베드 공통)
      initial_transform_timeout: 300.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pole_cam
        pole_cam:
          topic: /pole_cam/depth/color/points_filtered   # control/body_filter가 자기 몸(팔·차체) 점을 뺀 것
          data_type: "PointCloud2"
          min_obstacle_height: 0.03
          max_obstacle_height: 0.6
          marking: true
          clearing: true
          obstacle_min_range: 0.2
          obstacle_max_range: 2.5
          raytrace_min_range: 0.2
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 8.0


# ─────────────────────────────────────────────────────────────────────────────
# velocity_smoother — twist_mux 출력(/cmd_vel_mux)의 가속을 다듬어 /cmd_vel_smoothed (launch 리매핑)
#   한계는 FollowPath(프리셋 A)와 같게
# ─────────────────────────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.82]
    min_velocity: [-0.26, 0.0, -1.82]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # 입력이 이 시간(초) 끊기면 0으로
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true


# ─────────────────────────────────────────────────────────────────────────────
# collision_monitor — 맨 마지막 안전장치: /cmd_vel_smoothed → /cmd_vel. pole_cam 점구름 기준 부딪힐 방향만 멈춤(approach) · 가까우면 감속.
#   학습 보정(rl_nav_correction)까지 다 거친 최종 명령을 거른다 (00-overview "안전장치는 학습 노드보다 뒤")
#   source_timeout: 점구름이 이만큼 안 오면 정지 — 카메라 끊김 = 멈춤
# ─────────────────────────────────────────────────────────────────────────────
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: true
    polygons: ["Approach", "SlowZone"]
    # approach: 지금 속도로 계속 가면 time_before_collision 안에 몸(반경 0.18 + 2cm)이 점에 닿는 경우에만 그 속도를 줄여 멈춤.
    #   멀어지는 방향(후진·회전)은 그대로 통과 → 벽에 붙어도 빠져나온다.
    #   (예전 stop 원 0.22m는 방향과 무관하게 전부 정지 → 벽에 4cm 붙으면 후진도 못 해 갇혔음 — 실측)
    Approach:
      type: "circle"
      radius: 0.20
      action_type: "approach"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_approach
      enabled: true
    # 0.30m 안이면 절반 속도 (통로 가운데면 벽까지 약 0.37m라 평소엔 안 걸림)
    SlowZone:
      type: "circle"
      radius: 0.30
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true
    observation_sources: ["pole_cam"]
    pole_cam:
      type: "pointcloud"
      topic: /pole_cam/depth/color/points_filtered   # control/body_filter가 자기 몸(팔·차체) 점을 뺀 것
      min_height: 0.05
      max_height: 0.6
      enabled: true


# ─────────────────────────────────────────────────────────────────────────────
# lifecycle 관리자 — 맡은 서버를 순서대로 configure·activate (하나라도 실패하면 그 관리자 것만 중단)
#   둘로 나눈 이유: 하나로 묶으면 RTAB-Map이 아직 map→odom을 못 낼 때 global_costmap 실패로 바퀴 명령 체인까지
#   inactive → 수동 조작(→ twist_mux → velocity_smoother → collision_monitor)도 막힘 (실측, map:=slam)
#   bond_timeout: 활성화한 서버와 이 시간(초) 안에 bond(생존 신호)가 이어지지 않으면 중단.
#     기동 직후 CPU가 몰리면(진짜 Nav2 + 컨트롤러 + 인지) 10초 안에 신호가 늦게 와서 중단됐음(실측) → 여유 있게
# ─────────────────────────────────────────────────────────────────────────────
lifecycle_manager_base:          # 바퀴 명령 체인 — odom TF만 있으면 뜸
  ros__parameters:
    autostart: true
    bond_timeout: 60.0
    node_names: ["velocity_smoother", "collision_monitor"]

lifecycle_manager_navigation:    # 주행 계획 — map(→odom) 필요
  ros__parameters:
    autostart: true
    bond_timeout: 60.0
    node_names: ["planner_server", "controller_server", "behavior_server", "bt_navigator"]
