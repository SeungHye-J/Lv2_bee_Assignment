# plan 패키지 파라미터 — bringup이 노드에 넘긴다. user_input.command는 launch 인자 command가 덮어쓴다
user_input:
  ros__parameters:
    command: ""              # 시작 후 한 번 보낼 텍스트 명령 (비면 안 보냄)
vlm_task_planner:
  ros__parameters:
    max_replans: 1           # 명령 하나당 재계획 횟수 (coordinator의 max_step_failures와 짝)
    vlm_endpoint: ""         # 비면 템플릿 고정(기본·CI). 호스트 ai-service면 "http://127.0.0.1:8000" (컨테이너 host망이라 localhost가 호스트)
    vlm_timeout_s: 120.0    # [s] VLM 대기 — 넘기면 템플릿 폴백. ai-service backend human(사람이 웹에서 계획)이면 그쪽 timeout_s(600) 이상으로
    tray_capacity: 4         # MOVE_TO_B 템플릿이 한 번에 싣는 퍽 수 (coordinator tray_slots 칸 수와 같게)
    # 수납 확인 — 신호등 미션 옮기기가 끝나면 바로, 그 뒤 이 주기마다 목적지로 가서 옮긴 번호가 그대로 있는지 봄
    #   (AUTO · 하던 계획이 끝났을 때만). 다른 곳에 있으면 다시 옮기고, 안 보이면 say. 새 명령·신호가 오면 그만
    verify_period_s: 60.0    # [s] 0이면 주기 확인 끔 (옮긴 직후 한 번은 함)
    verify_radius_m: 0.20    # [m] 목적지 장소 상자(location_box) 윗면 가운데에서 이 안이면 "거기 있음" (place_spacing 0.08 × 퍼짐 + 여유)
coordinator:
  ros__parameters:
    # 시작 자세 — bringup 직후 한 번 팔을 이 자세로 (MoveIt 없이 JTC 토픽, 3초 궤적).
    #   0 = 서보 영점(팔 곧게 위). 다시 잡으려면 run-cli 팔 → 6 (TEACH로 손으로 잡으면 initial_pose·initial_gripper 줄을 보여 줌 → 여기 붙여 넣기).
    #   (예전 실측 [-0.0898, -1.8069, 1.3432, 1.6473, -0.0268]은 한계 안이었지만 실기에서 도달 못 하고 계속 밀어 과부하 — 그래서 재전송 1회 제한)
    #   MAPPING/EXPLORE면 스캔 자세가 우선이라 건너뛴다. false면 자동 이동 안 함.
    #   실행 중 끄기: ros2 param set /coordinator initial_pose_enabled false (가는 중이면 그 자리에서 멈춤)
    initial_pose_enabled: true
    initial_pose_joints: [joint1, joint2, joint3, joint4, joint5]
    # = MoveIt SRDF 'stow' = Isaac beebot.usda 접은 자세. joint2는 URDF 하한(-1.919862) 안쪽으로 -1.91
    #   (예전 TEACH 값 [-0.0215, -2.0019, 1.1152, 0.8682, 0.0936]은 joint2가 하한 밖이라 controller_manager가 잘라 도달 판정 실패)
    # 11/03 사용자 Isaac 관절 패널 stow: joint1 0 · joint2 −109.0° · joint3 97.6° · joint4 51.7° · joint5 0 · 그리퍼 0.011
    #   joint3 97.6°는 한계(URDF·USD 둘 다 80° = 1.396263) 밖 — Isaac도 80°에서 멈춘 자세. 77°(1.344) — 79°로 보냈더니 처짐 보정·중력으로 실제 1.408까지 들어가 한계(1.396) 밖 → MoveIt이 stow에서 출발하는 계획을 전부 거부했음 (실기 11/03)
    #   (예전 stow: [0.0, -1.91, 1.3701, 0.5952, 0.0])
    initial_pose: [0.0, -1.9024, 1.344, 0.9023, 0.0]
    initial_pose_tolerance: 0.05   # [rad] 이 안이면 이미 그 자세 (이동 생략)
    initial_pose_move_s: 3.0       # [s] 궤적 시간 — 너무 짧으면 급정지·흔들림
    initial_pose_retries: 1        # 못 가면 다시 보낼 횟수 — 넘으면 지금 자세로 멈추고 ERROR (걸린 채 계속 밀면 과부하)
    initial_gripper: 0.011         # [m] (11/03 stow 패널 값 — 간격 42 mm. 예전 0.0) 시작 그리퍼 (손가락 하나 이동량 — 0 닫힘 · 0.0265 열림) · 음수면 안 건드림. 팔 시작 자세와 함께 한 번
    max_grasp_tries: 2       # 파지 후보를 점수순으로 몇 개까지 시도 (규칙 4)
    max_step_failures: 2     # 같은 단계가 이만큼 연속 실패하면 알리고 정지 (규칙 5)
    server_wait_s: 30.0      # [s] Nav2·MoveIt 서버가 뜰 때까지 기다리는 시간
    arm_plan_tries: 3        # 팔 계획 실패 시 같은 목표로 다시 (IK·OMPL이 무작위라 닿는 곳도 가끔 못 찾음)
    # 적재함 (MISSION ③ — target "tray"): 칸 [x, y, …] base_footprint. MoveIt 실측으로 손끝 아래 방향이 닿는 곳
    #   (높이 0.22·0.17 6번씩: 앞줄 x −0.095 12/12 · 뒷줄 x −0.135 9/12 — 재시도로 메움, x −0.16 이후 거의 X — 폴·팔 길이).
    #   적재함 안쪽 x −0.185~−0.075. 싣는 순서 = 뒷줄 → 앞줄, 꺼내기는 반대. 발제 퍽 30×30(Ø30)×60mm — 앞뒤·좌우 간격 0.04·0.10이면 4개 들어감
    tray_slots: [-0.135, 0.05, -0.135, -0.05, -0.095, 0.05, -0.095, -0.05]
    tray_release_z: 0.22     # [m] 싣기 — 칸 위 이 높이(손끝)에서 그리퍼를 벌림 (적재함 바닥 약 0.15)
    tray_grasp_z: 0.17       # [m] 꺼내기 — 손끝 파지 높이 (적재함 바닥 0.15 + 퍽 60mm의 아래쪽 1/3)
    tray_approach_m: 0.05    # [m] 꺼내기 접근·들어올리기 (0.10이면 0.27로 닿지 않음)
    place_spacing: 0.08      # [m] 같은 곳(B 지역 판)에 여러 개 내려놓을 때 비키는 간격 (MISSION: 퍽 사이 0.08 이상)
    # 팔이 닿게 다가가기 — pick · place <물체 id> 때 대상이 로봇 중심에서 reach_m 넘으면 먼저 approach_m 앞까지 navigate (단계마다 한 번)
    #   바닥 퍽은 팔 회전축(차체 중심 앞 0.05)에서 수평 약 0.08~0.26 — 차체 중심 기준 약 0.13~0.31 (simulator 팔 범위 지도)
    reach_m: 0.30
    approach_m: 0.24         # [m] 다가간 뒤 로봇 중심 ~ 물체 중심 (범퍼 0.18 + 여유 — 팔 범위 가운데쯤)
    # inspect <퍽 id> — 퍽 윗면 16mm AprilTag는 gripper_cam이 위에서 봐야 읽힘 (pole_front_cam은 한 칸 1~2px라 못 읽음)
    inspect_height_m: 0.15   # [m] 손끝을 퍽 윗면 위 이만큼 (16mm 태그 ≈ 50px — 한 칸 약 6px)
    inspect_wait_s: 1.0      # [s] 그 자리에서 기다림 (perception 추론 4Hz × 몇 장)
    # 손 방향 — 파지 목표가 위→아래 손 자세(grasp_scorer · stand)면 수직축을 이 안으로 (못 풀면 180° 뒤집어 다시)
    arm_yaw_tolerance: 0.1   # [rad]
    # RL 정책 구간 — true면 pick <퍽 id> · place <물체 id>를 학습 시간표(plan/rl_segment.hpp) 관절 궤적 + 잔차 정책(ml/rl_policy)으로
    rl_policy: false         # 실기 확인 전까지 끔 (false = 예전 MoveIt 파지·놓기)
    rl_open_m: 0.010         # [m] 집기 전 벌림 (손가락 하나 — 간격 40 mm, 학습 open_gap_mm)
    rl_release_m: 0.008      # [m] 놓을 때 벌림 (간격 36 mm, 학습 release_gap_mm)
    rl_grasp_z: 0.0606       # [m] 손끝 ~ 퍽 바닥 (bee_common GRASP_Z = 퍽 60 − 잡는 깊이 20 + 손끝 20.6 mm)
    rl_above_m: 0.05         # [m] 내려가기 전 높이 (학습 above_m)
    # stand <누운 퍽 id> — 세우기 (isaac/lab/right_env.py tilt 모드 · 경로 식은 plan/stand_geometry.hpp)
    stand_open_m: 0.012          # [m] 벌림 (손가락 하나 — 간격 44 mm, 옆 퍽을 안 치게 조금만)
    stand_pinch_m: 0.007         # [m] 살짝 잡기 목표 (간격 34 mm) — 위치 제어로 쥐는 힘을 정함: 전류 상한은 원래 값으로 두고 목표를 퍽 접촉 위치에 가깝게 해 위치 오차(=힘)를 작게 (11/04). 안 닿아 빠지면 0.0065, 세면 0.0075
    stand_pinch_effort: 0.00538  # [A] 살짝 잡기 전류 한계 — Goal Current 2단위 (5.38 mA, 환산 ≈ 0.39 N = 학습 0.4 N). 모터가 2.69 mA 단위로 반올림해서 4~5 mA는 이 값. 11/04 위치 제어 시험으로 원래 값 복귀 (11/03에는 2.69 mA까지 낮췄었음)
    stand_close_effort: 0.01614  # [A] 잡기 ① 목표 간격까지 닫을 때 (6단위) — 그다음 stand_pinch_effort로 낮춰 쥠. 10.76 mA(4단위)로는 손가락이 43 mm에서 거의 안 닫힌 라운드가 있어 올림 (실측 11/04 bag). 5.38 mA로 바로 닫으면 안 움직임 (11/03)
    stand_grip_current: 0.007    # [A] 잡기 ①에서 이 전류 이상 + 0.2 s 안 움직이면 '쥠' → 살짝 쥐기로 낮추고 호 (실측: 퍽을 밀 때 8~10 mA)
    stand_empty_m: 0.003         # [m] 손가락이 이보다 닫히면 빈손 (간격 26 mm < 퍽 30 mm) → 벌리고 stand_no_grip
    stand_grip_timeout_s: 4.0    # [s] 이 안에 쥠·빈손 판단 못 하면 stand_grip_timeout
    stand_vel_scale: 0.7         # 직교 경로 속도·가속도 배율 (학습 arc_vel_scale 0.5 × 팀 한계보다 느리게 시작)
    stand_hang_s: 0.5            # [s] 호 끝에서 멈춤
    stand_verify_s: 1.5          # [s] 손을 뺀 뒤 기다렸다가 /tracked_objects 자세로 섰는지 확인
    support_levels: [0.0, 0.07]  # [m] 퍽이 놓이는 면 — 바닥 · 상자 윗면(발제 205×205×70). 잰 받침 높이를 가까운 값으로 맞춤 (stand · RL pick)
    support_snap_m: 0.05         # [m] 이 안이면 맞춤 (실측 11/03: 상자 위 누운 퍽이 0.098로 나옴 → 0.07)
    stand_puck_length_m: 0.060
    stand_puck_width_m: 0.030
    stand_contact_h_box_m: 0.030   # [m] 사각기둥 손가락 중심 높이 = 누운 퍽 윗면 (위쪽 절반만 잡음)
    stand_contact_h_cyl_m: 0.015     # [m] 원기둥 = 축 높이
    stand_pinch_from_end_m: 0.0      # [m] 손가락 중심선 ~ 먼 끝면 (0 = 끝면 위)
    stand_ee_above_contact_m: 0.0376 # [m] 손끝(end_effector_link)이 손가락 닿는 가운데보다 위 — 모델값 0.0106 + 하중 처짐 보정 0.027 (11/03 실측: 토크 켠 채 팔을 뻗으면 실제 손가락 끝이 TF보다 2.5~2.9 cm 낮음 — 대기 자리 TF 13.0 / 줄자 10.5 cm, TF 14.4 / 줄자 11.5 cm. 토크 끄고 손으로 받치면 TF와 2 mm 일치. 중간값 2.7 cm)
    stand_above_m: 0.04
    stand_lift_away_m: 0.08
    stand_tilt_over_m: 0.010         # [m] 호 끝까지 더 올림 (손이 앞서야 퍽이 따라옴)
    stand_arc_end_deg: 45.0          # [deg] 짧은 호 — 잡고 살짝 들어 로봇 쪽으로 당김 (11/03 실기: 큰 호 없이도 퍽이 손가락 사이에서 돌아 성공). 120°는 선 자세(90°)를 넘겨 돌리던 값. 90° 미만이면 되돌아오는 호 없이 곧장 내려놓는 점(90°)으로 감
    stand_set_dz_m: -0.010           # [m] 내려놓는 점 (< 0 = 눌러 세움)
    stand_drag_m: 0.04               # [m] > 0이면 호 대신 잡은 채 로봇 쪽으로 곧게(대각선) 끌고 눌러 놓음 (11/03 실기 — 호는 너무 높이 들었고 수평 끌기는 퍽이 안 들림). 0이면 호(stand_arc_end_deg)
    stand_drag_lift_m: 0.045         # [m] 끌면서 끝까지 올리는 양 — 수평 drag_m 0.04와 합쳐 약 48° 대각선 (먼 끝이 들려 가까운 끝 모서리를 축으로 섬. 0 = 수평). 11/04 퍽을 더 들려고 0.035에서 1 cm 올림

explorer:                    # 자동 탐사 — /state/operation_mode EXPLORE일 때 /map 프론티어로 Nav2 목표
  ros__parameters:
    min_frontier_cells: 8    # 이보다 작은 프론티어 덩어리는 무시 (칸 0.05m → 약 0.4m 입구)
    blacklist_radius: 0.4    # [m] 도착·실패·시간 초과한 프론티어 근처는 다시 안 감
    goal_timeout_s: 60.0     # [s] 목표 하나에 이보다 오래 걸리면 포기
    empty_checks: 3          # 프론티어 없음이 1초 간격으로 이만큼 이어지면 탐사 끝 (지도 갱신 중일 수 있어서)
    min_goal_dist: 0.4       # [m] 로봇에서 이보다 가까운 프론티어는 안 고름 — pole_front_cam이 로봇 바로 앞·아래(약 0.3m)를 못 봐 계속 '모름'으로 남음
    goal_search_radius: 0.3  # [m] 프론티어에서 이 안의 '갈 수 있는 칸'(코스트맵에서 로봇과 이어짐)을 목표 자리로 · 로봇 칸이 막혔을 때 시작 칸 찾는 반경
