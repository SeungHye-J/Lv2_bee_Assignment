# skill 노드 파라미터 (skills.launch.py) — 노드 이름 = skill_<skill>, 액션 = /skills/<skill>
#   팔 공통값은 params/arm.yaml · 자세·적재함 표는 params/basket.yaml · 세우기 표는 params/stand_table.yaml (launch가 같이 넘김)
#   학습 정책은 노드 파라미터가 아니라 models/skills/<skill>/meta.yaml (use: true면 씀)
skill_navigate:
  ros__parameters:
    server_wait_s: 30.0
    nav_near_m: 0.20         # [m] goal.target "near": 멈추거나 실패해도 목표에서 이 안이면 성공 (상자 앞 자리 — approach가 마저 맞춤)
    nav_near_yaw: 0.8        # [rad] "near" 성공은 방향 차도 이 안일 때만 (11-14: 등진 채 성공 처리 → approach가 크게 돌다 실패)
    nav_look_m: 0.6          # [m] goal.target "look": 남은 경로가 이만큼 안이면 팔을 pose_look으로 (상자 도킹 앞, 11-13)
    # [s] 남은 거리가 이 동안 nav_stall_gain_m도 안 줄면 취소 (nav_no_progress). Nav2 progress_checker(15 s)보다 길어야 함 —
    #   같으면 Nav2 복구(후진 0.10 m · 회전 · costmap 비우기)가 돌기 전에 끊음 (11-15 실기 approach_1115_112020~113543: 문 모서리
    #   21 cm 앞에서 collision_monitor가 멈춘 채 15 s → 복구 없이 실패 ×4). 코드 기본값 15 위에 덮음
    nav_stall_s: 12.0        # 11-16: 25 → 12 (progress_checker 15 → 6에 맞춤 · 복구 한 번 돌 시간은 남김)
    # 멈춤 감시 (11-16) — 자세(위치 + 방향)가 nav_still_s 동안 안 바뀌면 nav_stall_s를 기다리지 않고 끼임 풀기 (0 = 끔)
    #   실기 nav_1116_062046: collision_monitor 정지 뒤 8~11 s 그대로 서 있다가 끼임 풀기 ×5 (사용자 "막히면 생각을 너무 오래함")
    #   제자리 회전은 방향이 바뀌므로 안 걸림 · 끼임 풀기 횟수(nav_unstuck_tries)는 그대로
    nav_still_s: 3.0
    nav_still_m: 0.02        # [m]
    nav_still_deg: 3.0       # [deg]
    # 끼임 풀기 (11-15) — 진척 없음이면 곧게 후진 → 다시 받은 경로 쪽으로 제자리 회전 → 같은 점으로 다시 출발, 이 횟수까지 (0 = 끔)
    nav_unstuck_tries: 2
    nav_unstuck_back_m: 0.15
    # 문 경유점 (11-15) — 경로가 지나는 문마다 들어가기 점(문 앞에서 문 축으로 제자리 회전) · 나가기 점(문 너머, 일직선)을 끼움.
    #   실기 B3 6판·시뮬: 문을 대각선으로 질러 벽 끝 0.2 m 앞에서 collision_monitor 정지 → 경유점 넣고 시뮬 성공 (오차 1.5 mm)
    #   한 줄 = arena cx, cy (문 가운데), nx, ny (문 축 단위벡터), half_w (문 폭 절반), d_neg, d_pos (축 −쪽·+쪽 점까지 [m])
    #   plan.yaml arena_walls(11-15 실측)의 벽 끝 쌍 사이 틈(0.45~1.0 m)에서 계산 (점이 벽에서 0.34 m 넘게 떨어진 문만 — 제자리 회전 때 몸 뒤가
    #   0.29 m 반경으로 돎). 뺀 문(점 둘레가 좁음, 통로가 이미 문 축으로 몰아 줌): (2.19, 4.97) · (2.91, 2.03) · (2.51, 6.00) ·
    #   (3.23, 5.97) · (1.09, 0.30) · (4.04, 3.93). 비우면 ([]) 예전처럼 목표로 바로
    #   11-15: 들어가기·나가기 점을 문에서 0.55 m까지 (사용자 '진입점 미리') — 점에서 벽·상자까지 0.29 m(제자리 회전 반경) 남는 만큼만
    #     (scratch door_entry.py) · D2·D11 안쪽(상자 칸)은 0.30 그대로 · D3 아래 0.46
    doors: [0.725, 4.236, 0.0, 1.0, 0.365, 0.55, 0.55,
            3.229, 3.931, 1.0, 0.0, 0.340, 0.55, 0.30,
            2.593, 1.665, -1.0, 0.0, 0.365, 0.55, 0.46,
            1.107, 4.604, 0.999, -0.048, 0.368, 0.58, 0.55,
            1.125, 5.952, -1.0, 0.0, 0.353, 0.55, 0.55,
            3.229, 4.621, 1.0, 0.0, 0.350, 0.55, 0.55,
            1.090, 3.182, 1.0, 0.0, 0.320, 0.55, 0.55,
            2.216, 2.030, 0.0, 1.0, 0.378, 0.55, 0.55,
            2.216, 1.300, 0.0, 1.0, 0.378, 0.55, 0.55,
            1.494, 4.971, 0.0, 1.0, 0.369, 0.55, 0.55,
            2.870, 4.971, 0.0, 1.0, 0.359, 0.55, 0.30]
    # 막은 구역 (11-16 사용자) — 사각형 [x0, y0, x1, y1, …] (arena, m). 지도엔 안 칠하고, Nav2 경로가 이 안을 지나면 navigate 실패
    #   (nav_no_path_zone — 그쪽엔 문·길목 경유점이 없어 돌아갈 길도 없다고 봄). 처음 경로만 봄 — 가는 중 다시 짠 경로는 안 봄
    #   예전 plan.yaml keepout_zones 셋: 가로벽 끝 y 5.60~5.70 ~ 바깥 벽 띠 (RViz에서 위쪽) · 안쪽 벽 끝 x 4.044 ~ 바깥 벽 띠 ·
    #   벽 0.36→1.09 @ y 4.236 끝 ~ 바깥 벽 띠 (11-16 셋 다 칠하기 → 여기). 비우면 ([]) 안 봄
    no_path_zones: [-0.050, 5.620, 4.450, 6.350,
                    4.040, -0.050, 4.450, 6.350,
                    -0.050, 4.150, 0.360, 6.350]
    start_pose_arena: [0.734, 0.950, 3.14159]   # plan.yaml과 같게 — 문(arena)을 map으로 옮길 때
    door_use_correction: false   # 문에 /arena/correction을 얹을지 — costmap 벽(/arena/walls)과 같은 기준이 되게 끔 (보정은 로봇 위치로 들어감)
    door_goal_skip_m: 0.30   # [m] 목표가 나가기 점 + 이만큼 안이면 나가기 점을 뺌 (문 바로 너머 상자 앞 자리)
    # 경유점 지도 (11-15 사용자 지정, 그림 위에 찍은 점 → 수직·수평 정렬) — 보이는 점끼리(벽·상자에서 via_clearance 넘게) 최단으로
    #   이어 경유점. 화살표 a → b(한쪽만): b에는 a에서만 들어감 (그 방향으로 갈 땐 꼭 거침) · 거꾸로 나가는 건 자유 · 양쪽 = 그냥 길.
    #   가르친 경로가 없을 때 문 경유점 대신 (로봇·목표가 어느 점과도 못 이어지면 문 경유점). 비우면 ([]) 문 경유점만
    #   점 순서: 0:L3app 1:B2app 2:L1app 3:B6app 4:B3app 5:L2top 6:L2left 7:L2right 8:B1app 9:L2bot 10:B5app 11:B4app 12:W_B2 13:W_mid 14:G1 15:G2 16:Wc_a 17:Wc_b 18:We_a 19:We_b
    via_points: [3.659, 4.620, 3.670, 2.710, 3.275, 0.965, 2.936, 3.886, 2.936, 4.620, 2.724, 3.661, 2.275, 4.134, 2.275, 3.174, 2.275, 0.950, 1.840, 3.661, 1.515, 5.354, 0.734, 4.620, 3.670, 1.764, 2.275, 2.390, 2.275, 1.764, 1.515, 4.620, 1.515, 3.174, 0.607, 3.174, 1.515, 0.370, 0.607, 0.370]
    via_arrows: [4, 0, 14, 12, 12, 1, 14, 13, 14, 8, 8, 2, 15, 10, 15, 11, 16, 17, 17, 16, 18, 19, 19, 18]
    via_clearance: 0.18
    nav_pre_spin_deg: 45.0   # 출발 전 첫 경유점 쪽이 이보다 틀어져 있으면 먼저 제자리 회전 (0 = 끔) — 11-16 시뮬: S4에서 돌아 나오다 벽
    via_through: true        # 11-16: 경유점 + 목표를 NavigateThroughPoses 한 번으로 — 경유점에서 서지 않고 지나감 (0.40 m 안이면 지난 것, navigate_through_poses.xml) · false = 경유점마다 NavigateToPose
    # 벽 · 상자 — plan.yaml arena_walls · start_boxes + location_boxes와 같게 (점끼리 보이는지만 봄)
    via_walls: [0.000, 0.000, 4.404, 0.000, 0.000, 6.304, 4.404, 6.304, 0.000, 0.000, 0.000, 6.304, 4.404, 0.000, 4.404, 6.304,
                1.862, 4.971, 2.511, 4.971, 0.360, 4.236, 1.090, 4.236, 3.229, 4.271, 4.044, 4.271, 3.229, 3.591, 4.044, 3.591,
                1.090, 2.030, 1.838, 2.030, 2.593, 2.030, 3.229, 2.030, 1.090, 1.300, 1.838, 1.300, 2.593, 1.300, 4.084, 1.300,
                1.125, 4.971, 1.125, 5.599, 2.511, 4.971, 2.511, 5.704, 3.229, 4.971, 3.229, 5.644, 1.090, 3.502, 1.090, 4.236,
                3.229, 2.030, 3.229, 3.591, 1.090, 2.030, 1.090, 2.862, 1.838, 1.300, 1.838, 2.030, 1.090, 0.605, 1.090, 1.300]
    via_boxes: [1.468, 0.950, 0.1025, 3.670, 3.152, 0.1025, 2.936, 5.354, 0.1025, 0.734, 5.354, 0.1025, 2.202, 5.354, 0.1025, 3.670, 3.886, 0.1025, 3.714, 0.965, 0.1025, 2.275, 3.661, 0.1025, 3.659, 5.289, 0.1025]
skill_approach:
  ros__parameters:
    approach_mode: "sim"     # sim: 목표 방향 직선 따라가기 (carrot 조향 ≤ approach_v_max → 마지막 방향) + 주행 정책 보정 · legacy: 예전
    approach_speed: 0.05     # [m/s] legacy 직선 속도 (앞 자리로 갈 때는 2배)
    approach_pre_m: 0.10     # [m] legacy: 목표 뒤 이만큼에서 목표 방향으로 돌고 직선 (박스 바로 앞 제자리 회전 금지)
    approach_pos_tol: 0.005  # [m] legacy 도착
    approach_yaw_tol: 0.03   # [rad] legacy 방향 맞춤
    approach_timeout_s: 30.0 # [s] 전체 · 4초 동안 3 mm도 못 줄이면 approach_blocked
    residual_v: 0.02         # [m/s] 정책 행동 1 = 이만큼 (시뮬 res_v)
    residual_w: 0.1          # [rad/s] (시뮬 res_w)
    approach_min_speed: 0.03 # [m/s] 도착 전 최소 속도 — 실기 바퀴가 약 2~3 cm/s 아래 명령엔 안 움직여 마지막 1~2 cm에서 멈췄음 (11-12)
    approach_release_m: 0.03 # [m] sim: tol_m×0.6 안에 한 번 들면 이만큼 벗어날 때까지 마지막 방향만
    approach_carrot_m: 0.05  # [m] sim: 목표 방향 직선 위 이만큼 앞 점을 향해 조향 (옆 어긋남을 도착 전에 없앰)
    approach_v_max: 0.06     # [m/s] sim 전진 상한 (11-13: 0.12는 빠름 — 사용자)
    approach_w_max: 0.5      # [rad/s] sim 회전 상한 (11-13: 1.0은 면 맞출 때 크게 돎)
    approach_exit_m: 0.151   # [m] goal.target "exit" 기본 후진 거리 (values[0]이 있으면 그 값) — 상자에서 standoff까지 (0.25 − gap 0.099)
    # 상자 도킹 (goal.values = [gap, half]): 도면 자리는 힌트 — 인지 상자로 목표를 정함 (11-12). 팔은 pose_look으로 천천히 (launch arm_velocity_scale 0.15)
    box_match_m: 0.45        # [m] 힌트 상자 가운데에서 이만큼 안의 start_box · location_box만 (11-13: 0.35 → 0.45 — 지도 오차 20~25 cm에 측정이 밖으로 나감, 상자끼리는 0.7 m 넘게 떨어짐)
    box_wait_s: 8.0          # [s] 첫 측정까지 정지해서 기다림 — 넘으면 approach_box_unseen
    box_seed_s: 30.0         # [s] 첫 측정만 이만큼 지난 것도 받음 (시작 전 기억 포함 — map→odom은 관측 시각 것이라 오래돼도 맞음) — 시작하며 팔이 올라가 pole_front_cam이 가려져도 도착 직전 측정으로 시작 (11-13)
    box_stale_s: 1.0         # [s] last_seen이 이보다 오래된 측정은 버림
    box_jump_m: 0.08         # [m] 추정에서 이만큼 넘게 튄 측정은 버림
    box_alpha: 0.3           # 새 측정을 섞는 비율
    box_rate_mps: 0.02       # [m/s] 목표를 옮기는 최대 속도 (11-12: 측정마다 1 cm → 8 cm/s로 목표가 움직여 상자 앞에서 크게 돎)
    box_rate_dps: 3.0        # [deg/s] 목표 방향을 돌리는 최대 속도
    box_min_side_m: 0.19     # [m] 윗면 짧은 변이 이보다 작으면 잘린 측정 — 버림 (가운데가 보이는 쪽으로 쏠림)
    box_freeze_m: 0.10       # [m] 목표까지 이보다 가까우면 목표 고정 (가까울수록 잘려 보임 — 마지막은 odom)
skill_pose:
  ros__parameters:
    initial_pose_enabled: true
    initial_pose_joints: [joint1, joint2, joint3, joint4, joint5]
    initial_pose: [0.0, -1.9024, 1.344, 0.9023, 0.0]
    initial_pose_tolerance: 0.08   # [rad] 이 안이면 이미 그 자세 (이동 생략) — 앞먹임으로 엔코더 joint3가 약 0.054 벗어남
    initial_pose_move_s: 3.0       # [s] 궤적 시간 — 너무 짧으면 급정지·흔들림
    initial_pose_retries: 1        # 못 가면 다시 보낼 횟수 — 넘으면 지금 자세로 멈추고 ERROR (걸린 채 계속 밀면 과부하)
    initial_gripper: 0.011         # [m] (11/03 stow 패널 값 — 간격 42 mm) 시작 그리퍼 (손가락 하나 — 0 닫힘 · 0.0265 열림) · 음수면 안 건드림
skill_inspect:
  ros__parameters:
    inspect_height_m: 0.15   # [m] 손끝을 퍽 윗면 위 이만큼 (16mm 태그 ≈ 50px — 한 칸 약 6px) · 시뮬 camera_look_down 0.08에서 100 %
    inspect_wait_s: 1.0      # [s] 그 자리에서 기다림 (perception 추론 4Hz × 몇 장)
skill_pick:
  ros__parameters:
    max_grasp_tries: 2       # 파지 후보를 점수순으로 몇 개까지
skill_pick_far:              # 박스 먼 쪽 퍽 — 시뮬 pick_env 먼 퍽 모드(train.py --task pick_far)와 같은 값
  ros__parameters:
    max_grasp_tries: 2
    far_open_gap_m: 0.066    # [m] 닿는 구간 전 손가락 사이 (시뮬 far_open_gap_mm 66)
    far_tilt_deg: 45.0       # 들어갈 때 손 기울기 — 아래 셋은 정책 학습 조건, 바꾸면 시뮬과 달라짐
    far_back_m: 0.08         # [m] 뒤로 뺀 자세: 쥘 자리에서 손 방향으로 이만큼 뒤
    far_lift_in_max_m: 0.08  # [m] 들어올릴 때 안 닿으면 로봇 쪽으로 당기는 최대
    far_contact_vel_scale: 0.7      # 닿는 구간 속도 (팀 관절 한계 ×), 퍽 x ≤ far_slow_x_m — 정책 학습 범위 0.5~0.7 안에서만 (0.3 학습 안 함)
    far_contact_vel_scale_far: 0.5  # 퍽 x > far_slow_x_m (박스 끝, 팔 거의 다 뻗음) — 70 %면 95.7 %라 천천히
    far_slow_x_m: 0.27             # [m, base_footprint 퍽 바닥 가운데] 시뮬 11/13: 70 %는 ≤ 270 mm 99.0 % · 50 %는 전체 99.3 %
skill_place:
  ros__parameters:
    held_bottom_m: 0.0606    # [m] 손끝 → 손 안 퍽 바닥
    place_release_m: 0.02    # [m] 벌리는 높이 (퍽 바닥이 면 위 이만큼)
    place_approach_m: 0.08   # [m] contact_mode moveit: 위에서 내려오는 높이
skill_load:
  ros__parameters:
    server_wait_s: 30.0
    load_lift_m: 0.03        # [m] 박스 앞에서 시작하면 손을 곧게 이만큼 올린 뒤 carry로 · 0 = 안 올림
                             #   pick 끝 손 안 퍽 바닥 = 박스 위 5 cm (pick_above_m) → +3 cm = 8 cm, 옆 퍽 윗면(6 cm)보다 2 cm 위 (11/08 5 cm는 너무 높음)
    load_end_pose: over      # 싣고 나서 칸 위 그대로 (11-15: stow는 다음 pick이 stow를 거쳐 감) — 다음 pick은 carry를 멈추지 않고 지나 퍽 위로 (pick_via_carry) · 주행 전 stow는 mission이 따로 보냄 · stow | carry | over
    jam_current_a: 0.3       # [A] 닿는 구간 막힘 기준 (arm_io) — load만 (pick 0.5): 11-15 bag 정상 load 끝 −0.21 ~ +0.06 A · 걸린 load +0.42 ~ +1.03 A (j3 21~48 mrad 못 따라감). 0.5는 +0.42/+0.45 걸림을 놓침 · 1.3은 더 놓침
    load_over_lift_m: 0.04   # [m] 옆 칸 위는 칸 위(q_over)보다 이만큼 높게 지나고 곧게 내려옴 — 손 안 퍽 바닥이 적재된 옆 퍽 윗면 위 약 4 cm (11/12 시뮬 옆 퍽 침) · 0 = 예전
skill_unload:
  ros__parameters:
    server_wait_s: 30.0
skill_stand:
  ros__parameters:
    stand_waypoints: ik            # ik (해석 IK, 기본) | table (params/stand_table.yaml, scripts/stand_table_export.py)
    stand_box_top_m: 0.07          # 시작 박스 윗면 높이 (바닥 기준) — 누운 퍽 바닥
    # 위치형 쥐기 (실기 11/04): 목표 위치를 퍽 접촉 가까이 두고 전류 상한으로 힘을 정함 — 안 닿아 빠지면 stand_pinch_m 0.0065, 세면 0.0075
    stand_open_m: 0.012            # [m] 벌림 (손가락 하나 — 간격 44 mm, 옆 퍽을 안 치게)
    stand_pinch_m: 0.0062          # [m] 쥐는 목표 — 간격 30 mm (stand_plan GRIP_STOP, 11/08 사용자) · 이전 0.007 · 11-15 0.0050(퍽 안쪽, 빈손 판정용)으로 해봤다가 세게 쥐어 되돌림 (사용자)
    stand_close_current_a: 0.01614 # [A] 목표까지 닫을 때 (6단위) — 10.76 mA는 안 닫힌 라운드가 있었고 5.38 mA로 바로 닫으면 안 움직임
    stand_pinch_current_a: 0.00538 # [A] 쥠을 확인한 뒤 낮춰 쥐는 전류 (2단위, 환산 ≈ 0.39 N)
    stand_grip_current_a: 0.007    # [A] 이 전류 이상 + 0.2 s 안 움직임 = 쥠 (실측: 퍽을 밀 때 8~10 mA)
    stand_empty_m: 0.003           # [m] 이보다 닫히면 빈손 → stand_no_grip (목표가 퍽 폭이라 빈손도 0.0062에서 멈춤 — 빈손은 못 가림, look에서 확인)
    stand_grip_timeout_s: 4.0      # [s] 넘으면 stand_grip_timeout
    stand_hold_s: 0.3              # [s] 퍽 위(stand 첫 자세 · stand_pick 쥐는 자리)에서 멈춤 — 처짐 보정 쌓임
    # 대각선 끌기 (실기 11/03~04 — 큰 호는 퍽을 너무 높이 듦, 수평 끌기는 퍽이 안 들림). stand_drag_m 0이면 호 (stand_arc_end_deg)
    stand_drag_m: 0.0              # [m] 잡은 채 로봇 쪽으로 곧게 끎 — 0 = 호 (11/08 사용자: 끌기 안 씀 · 이전 0.04)
    stand_drag_lift_m: 0.0         # [m] 끌면서 올리는 양 (stand_drag_m > 0일 때만) — 11-15 실기 0 · 이전 0.035 (약 41° 대각선)
    stand_arc_end_deg: 100.0       # [deg] 호 끝 각도 (11/08 사용자 · 이전 60)
    stand_set_dz_m: 0.0            # [m] 끝점에서 눌러 놓음 — 11-15 실기 0 · 이전 −0.020
    stand_arc_k: 0.5               # 호의 퍽 축 방향 배율 (1 원 · 0 그대로 위로) — 11-15 실기 0.5 · 코드 기본 1.0
    stand_tilt_over_m: 0.030       # [m] 호 끝까지 더 올림 — 11-15 실기 0.030 (같은 날 0.020도 시험)
    stand_release_deg: 80.0        # [deg] 호가 이 각도를 지날 때 그리퍼를 벌림 (팔은 호 끝까지) — 11-15 실기 80 · ≤ 0 = 호 끝에서
    stand_flip_roll: true          # 손목 roll 180° — 손 카메라가 퍽 몸통 쪽. stand_grasp 정책이 이 방향으로 학습됨 (11-15 실기 true · 코드 기본 false)
    stand_cam: false               # 내려가기 전 손 카메라로 퍽을 다시 재고 고침 — 11-15 실기: 앞쪽으로 약 12 mm를 고쳐 퍽 끝 밖을 쥠(헛손질) · 옆 14~15 mm 어긋남, 안 고친 판은 끝을 정확히 쥠 → 끔 (코드 기본 true)
    stand_puck_dx_m: 0.0           # [m] inspect 퍽 x 보정 — 11-15 실기 0 (손 카메라가 다시 잼) · 코드 기본 −0.010
    stand_above_m: 0.04            # [m] 대기 높이 (못 닿으면 3 → 2 → 1 cm)
    stand_lift_away_m: 0.13        # [m] 손 빼기 높이 (못 닿으면 6 → 4 → 3 cm) — 11-15: 0.08이면 손 카메라가 선 퍽 윗면에서 약 0.10 m (D435 최소 거리 안) → 0.13으로 올려 그 자리에서 depth 판정 (stand_loop) · 이전 0.08
    stand_contact_h_box_m: 0.037   # [m] 손가락 중심 높이 (상자 윗면 기준) — 11-15 실기 0.037 · 이전 0.030 (원기둥은 0.030 그대로)
    stand_contact_h_cyl_m: 0.030
    stand_vel_scale: 0.7           # 내려가기·위로 × 팀 관절 한계 (실기 11/04)
    stand_arc_vel_scale: 1.0       # 끌기·호 × 팀 관절 한계 — 11-15 사용자 1.0 고정 (같은 날 1.5 · 2.0도 시험) · 이전 0.7 (시뮬 호 실험: 0.3 → 63 %, 0.5 → 100 %)
