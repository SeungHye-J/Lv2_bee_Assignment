# 팔 skill 노드 공통 (skills.launch.py가 arm_skills 컨테이너의 팔 skill 노드 모두에 넘김 — 값 하나로 같이 바꿈)
arm_plan_tries: 3        # 팔 계획 실패 시 같은 목표로 다시 (IK·OMPL이 무작위라 닿는 곳도 가끔 못 찾음)
contact_mode: "sim"      # sim: 퍽·칸에 닿는 구간은 시뮬과 같은 기준 동작 + 학습 보정 (2026-11-03 배포 결정) · moveit: 예전처럼 MoveIt만
# 잡기 판정 (닫은 뒤 gripper_left_joint 위치 + 전류) — 실기에서 다시 맞출 값. grasp_check는 bringup 인자 (faker는 false)
grip_current_a: 0.35     # [A] 닫을 때 쥐는 힘 (goal effort → Goal Current) — 팀 결정 0.3~0.4 A
grasp_min_pos_m: 0.003   # [m] 이보다 더 닫히면 빈손
grasp_min_effort: 0.25   # [A] 이보다 전류가 작으면 빈손 (원기둥 실측 0.33~0.42 A)
server_wait_s: 30.0      # [s] MoveIt · Nav2 서버가 뜰 때까지 기다림
