# Gazebo → ROS (/gz_raw/*) — develop/gazebo/relay.py가 벽시계 찍어 표준 토픽으로 재배포
# 사용: ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=<이 파일>
- ros_topic_name: /gz_raw/pole_front_cam/color/image_raw
  gz_topic_name: /pole_front_cam/rgbd/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /gz_raw/pole_front_cam/aligned_depth_to_color/image_raw
  gz_topic_name: /pole_front_cam/rgbd/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /gz_raw/pole_front_cam/color/camera_info
  gz_topic_name: /pole_front_cam/rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /gz_raw/gripper_cam/color/image_raw
  gz_topic_name: /gripper_cam/rgbd/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /gz_raw/gripper_cam/aligned_depth_to_color/image_raw
  gz_topic_name: /gripper_cam/rgbd/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /gz_raw/pole_front_cam/depth/color/points
  gz_topic_name: /pole_front_cam/rgbd/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /gz_raw/gripper_cam/depth/color/points
  gz_topic_name: /gripper_cam/rgbd/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /gz_raw/gripper_cam/color/camera_info
  gz_topic_name: /gripper_cam/rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
# 정렬 depth용 camera_info (RealSense와 같은 세트 — 내용은 color와 같은 내부 파라미터)
- ros_topic_name: /gz_raw/pole_front_cam/aligned_depth_to_color/camera_info
  gz_topic_name: /pole_front_cam/rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /gz_raw/gripper_cam/aligned_depth_to_color/camera_info
  gz_topic_name: /gripper_cam/rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
# IMU (base_link) — /imu(하드웨어·mock)와 안 겹치게 /imu_gz로 나감
- ros_topic_name: /gz_raw/imu_gz
  gz_topic_name: /imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
# 차체 구동 (testbed /cmd_vel·/odom과 분리 — /gz/* 로만)
- ros_topic_name: /gz/cmd_vel
  gz_topic_name: /model/beebot/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /gz/odom
  gz_topic_name: /model/beebot/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
# testbed mock 관절 → Gazebo JPC (미러: testbed가 리드, Gazebo가 따라옴)
- ros_topic_name: /gz_arm/joint1/cmd
  gz_topic_name: /model/beebot/joint/joint1/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gz_arm/joint2/cmd
  gz_topic_name: /model/beebot/joint/joint2/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gz_arm/joint3/cmd
  gz_topic_name: /model/beebot/joint/joint3/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gz_arm/joint4/cmd
  gz_topic_name: /model/beebot/joint/joint4/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gz_arm/joint5/cmd
  gz_topic_name: /model/beebot/joint/joint5/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gz_arm/gripper_left_joint/cmd
  gz_topic_name: /model/beebot/joint/gripper_left_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gz_arm/gripper_right_joint/cmd
  gz_topic_name: /model/beebot/joint/gripper_right_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
