# 학습용 skill 목록 — 한 곳에서 관리 (설명 페이지: https://junekunst.github.io/bee/skill-learning.html)
# method: rl(기준선 + 학습 보정) · supervised(지도학습, 보상 대신 손실) · measured(실측 데이터 모델) · none(학습 없음) · keep(지금 방식, 학습 여부 확인 필요)
# baseline: 학습한 것과 비교할 지금 방식 — 시뮬에서 이보다 좋을 때만 바꿈
# start / success: skill 계약 (Isaac Lab 종료 조건 · coordinator 판정 · plan_next 행동 막기가 같은 정의를 씀)
# reward: rl은 보상 항, supervised·measured는 손실. 모든 rl에 common_penalty를 더함

common_penalty: [puck_tipped_or_dropped (큰 벌점), collision, body_tilt (비상 E1과 같은 기준), joint_limit, motor_overcurrent, residual_magnitude]

tasks:
  observe: [camera_clear_view, read_signal_barcode]
  survey: [navigate, dock_box, camera_look_down, detect_puck, classify_color, read_puck_tag, classify_shape_pose]
  collect: [pregrasp, pick_upright, stand_up, regrasp_stood, load_slot]
  place: [navigate, dock_box, detect_location_box, unload_slot, place_cell, judge_cell, nudge_cell, stand_in_place]
  verify: [navigate, dock_box, camera_look_down, judge_cell]
  return: [move_pose, navigate, park_home]

skills:
  # ---------- 주행 (차동 구동 — 횡이동 없음: drive_turn → drive_straight → drive_turn)
  drive_straight: {area: drive, method: rl, baseline: diff_drive 제어기, start: 앞 경로 비어 있음 · 팔 접힘, success: 거리·방향 오차 기준 안 · 멈춤,
                   reward: [+목표 거리 접근, -옆 벗어남, -방향 틀어짐, +도착, -넘어서 감]}
  drive_turn: {area: drive, method: rl, baseline: diff_drive 제어기, start: 회전 반경 안 장애물 없음, success: 각도 오차 기준 안 · 제자리,
               reward: [+목표 각도 접근, -제자리 밀림, +도착, -넘어서 돎]}
  drive_arc: {area: drive, method: rl, baseline: diff_drive 제어기, start: 경로 비어 있음, success: 목표 자세 도착,
              reward: [+목표 자세 접근, -경로 이탈, -급가속]}
  navigate: {area: drive, method: rl, baseline: Nav2, start: 팔 stow · 위치 추정 정상, success: 목표 영역(0.25m) 도착,
             reward: [+목표 영역 도착, +경로 따라감, -장애물 근접, -멈춤·헤맴]}
  dock_box: {area: drive, method: rl, baseline: 스크립트 approach, start: 상자 0.25m 앞 · 상자가 보임, success: 상자 기준 거리·옆·각도가 팔이 닿는 영역 안,
             reward: [+닿는 영역 도착, +다음 집기 성공 보너스, -상자 충돌]}
  park_home: {area: drive, method: rl, baseline: 스크립트, start: 출발 구역 근처, success: 차체 전체 구역 안 · 3초 정지,
              reward: [+차체 전체 구역 안, +3초 정지, -구역 선 밟음]}

  # ---------- 인식
  detect_puck: {area: perception, method: supervised, baseline: "-", loss: [위치 오차, 놓침, 잘못 찾음]}
  classify_color: {area: perception, method: supervised, baseline: 색 규칙, loss: [색 오답]}
  read_puck_tag: {area: perception, method: supervised, baseline: AprilTag, loss: [ID 오답]}
  classify_shape_pose: {area: perception, method: supervised, baseline: 규칙, loss: [모양·자세 오답, 방향 각도 오차(180° 대칭)]}
  detect_location_box: {area: perception, method: supervised, baseline: 태그 규칙, loss: [윗면 위치·방향 오차]}
  read_signal_barcode: {area: perception, method: supervised, baseline: 규칙, loss: [색 오답, 놓친 점멸, "불확실하면 모름이 정답 (추정 금지)"]}
  judge_cell: {area: perception, method: supervised, baseline: 기하 계산, loss: [추정 오차 - 실제 오차]}

  # ---------- 팔 (카메라 조작 · 집기 · 놓기 · 적재함)
  compensate_sag: {area: arm, method: measured, baseline: 고정값, loss: [예측 처짐 - 실제 처짐]}
  grip_force: {area: arm, method: measured, baseline: 고정 전류, loss: [예측 힘 - 실제 힘]}
  move_pose: {area: arm, method: rl, baseline: MoveIt, start: "-", success: 관절 오차 기준 안, reward: [+목표 관절 접근, +도착, -흔들림]}
  pregrasp: {area: arm, method: rl, baseline: MoveIt, start: 퍽 위치 앎 · 손 비어 있음, success: 손끝 위치·방향 기준 안,
             reward: [+목표점 접근, +손 방향 맞음, -퍽 건드림]}
  camera_clear_view: {area: arm, method: rl, baseline: MoveIt (scan 자세), start: "-", success: 팔이 기둥 카메라 시야 밖, reward: [+시야 밖, +도착]}
  camera_look_down: {area: arm, method: rl, baseline: MoveIt (inspect), start: 볼 점 앎, success: 점이 화면 가운데 · 0.15m 위,
                     reward: [+점이 화면 가운데, +높이 맞음, +태그 읽음 보너스]}
  pick_upright: {area: arm, method: rl, baseline: 스크립트 + IK, start: 손이 퍽 위 · 퍽 서 있음 · 손 비어 있음, success: 들어 올림 · 손가락 ≥3mm · 전류 ≥0.25A,
                 reward: [+들어 올림, +잡기 판정, -옆 퍽 건드림, -미끄러짐, +끝 자세가 load_slot 시작 범위 안]}
  stand_up: {area: arm, method: rl, baseline: 스크립트 + 해석 IK (stand), start: 퍽 누움 · 손이 먼 끝 위, success: 퍽 서 있음(인식) · 손 빠짐,
             reward: [+퍽 서 있음, +손 벌리고 빠짐, -상자 밖으로, -0.4N보다 세게 쥠]}
  regrasp_stood: {area: arm, method: rl, baseline: 스크립트 (stand_pick), start: stand_up 성공 직후, success: 들어 올림 · 잡기 판정,
                  reward: [+들어 올림, +잡기 판정, -다시 넘어뜨림]}
  load_slot: {area: arm, method: rl, baseline: 적재함 표 (basket.yaml), start: 손에 퍽 · 칸 비어 있음, success: 칸 바닥까지 · 손 빠짐,
              reward: [+칸 바닥까지, +손 빠짐, -링 모서리 걸림, -옆 칸 건드림]}
  unload_slot: {area: arm, method: rl, baseline: 적재함 표, start: 손 비어 있음 · 칸에 퍽, success: 들어 올림 · 잡기 판정,
                reward: [+들어 올림, +잡기 판정, -링 걸림, +끝 자세가 place_cell 시작 범위 안]}
  place_cell: {area: arm, method: rl, baseline: 스크립트 + IK, start: 손에 퍽 · 칸 위 · 칸 보정 끝, success: 칸 중심 10mm 안 · 기울기 ≤5° · 2초 안정 · 이웃 그대로,
               reward: [+10mm 안 (가까울수록), +기울기 작음, +2초 안정, -이웃 건드림·밀어냄]}
  nudge_cell: {area: arm, method: rl, baseline: 스크립트, start: 놓은 퍽 10~25mm 벗어남 · 손 비어 있음, success: 10mm 안 · 서 있음,
               reward: [+오차 줄어듦, +10mm 안, -넘어뜨림, -이웃 건드림]}
  stand_in_place: {area: arm, method: rl, baseline: stand_up, start: 칸 안 퍽 누움, success: 서 있음, reward: [stand_up과 같음, -이웃 건드림 (큰 벌점)]}

  # ---------- 상태 · 비상 (감시 — 다른 skill의 시작·중단 조건)
  monitor_battery: {area: status, method: supervised, baseline: 전압 문턱값, loss: [예측 잔여 시간 - 실제]}
  monitor_current: {area: status, method: supervised, baseline: 전류 문턱값, loss: [걸림 판정 오답]}
  monitor_motor: {area: status, method: supervised, baseline: 온도 문턱값, loss: [고장 예측 오답]}
  basket_ledger: {area: status, method: none, baseline: coordinator 장부}
  detect_tip_impact: {area: emergency, method: supervised, baseline: 기울기 문턱값, loss: [넘어짐 예측 오답 (놓침에 큰 가중)]}
  estop: {area: emergency, method: none, baseline: 버튼 · 모드}

  # ---------- 맵 (학습 여부 확인 필요 — 제안: 유지)
  slam_localize: {area: map, method: keep, baseline: cuVSLAM + EKF}
  build_map: {area: map, method: keep, baseline: nvblox}
  align_arena: {area: map, method: keep, baseline: 시작 자세 + 상자 태그}

  # ---------- 플랜
  plan_next: {area: plan, method: rl, baseline: mission_manager 규칙, start: 매 skill 끝, success: "-",
              reward: [장소별 주사위 눈 +10, 색·모양 +6, 검증 +2, 복귀 +10, 자율 완주 +5, -퍽 떨어뜨림, -걸린 시간 조금],
              code: learning/plan}
