hold_s: 0.5          # [s] 그 안에 멈춰 있어야
limit_s: 25.0         # [s] 시뮬 제한 시간 (정책 입력 시간 비율)
source: isaac/lab drive_env task=dock · 512 env × 1500회 (feature/skill-envs, 11-03)
