# Test-only ros2_control setup: JTC writes straight to BeebotSystemHardware (no rl_arm_correction chain,
# no diff_drive / imu / gripper action controllers). Unclaimed commands: wheels -> 0, nothing else moves.
controller_manager:
  ros__parameters:
    update_rate: 50
    # BeebotSystemHardware::on_activate copies the position state into the command, but before the first
    # serial read that state is 0 -> every arm joint is commanded to 0 at startup. Start inactive (read() runs,
    # write() does not), let the real pose come in, then the launch activates it.
    hardware_components_initial_state:
      inactive: [BeebotSystem]

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, gripper_left_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
