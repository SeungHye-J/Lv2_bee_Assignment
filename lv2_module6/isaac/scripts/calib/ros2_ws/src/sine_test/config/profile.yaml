# Settings for `profile_test <joint_name> <mode>` (hold | step | ramp). Angles in deg around the joint center
# (0 deg = servo upright, + offset). Common keys as in sine.yaml. Runs go to logs/profile/<ts>_<joint>_<mode>/.
#   hold: slow move (move_s, cosine) to each target, keep it dwell_s, back to center
#         -> gravity sag (measured - command) and holding current per angle -> link mass / COM, stiffness
#   step: command jumps to +size, center, -size, center (dwell_s each) for every size
#         -> speed saturation (URDF velocity / USD maxJointVelocity), overshoot, settling time -> damping
#   ramp: center -> +amplitude -> -amplitude -> center at constant `speed` [deg/s], `cycles` times
#         -> the measured position stops at each reversal: backlash width, current jump = friction
# gripper_left_joint: values in m (center = middle of the URDF range 0..26.5 mm = 13.25 mm). Its hold is a calibration:
#   dwell 10 s at each opening so the finger travel can be measured with calipers (firmware GRIPPER_RAD_PER_M is a TODO).
#   Nothing between the fingers (current-based position mode: it stops on contact).
# hold targets stay where the arm cannot hit the base or the floor with joint3/4 at 0 (forearm horizontal).
out_subdir: profile
sample_hz: 50
settle_s: 1.0
move_s: 3.0
speed_margin: 0.7
limit_margin:
  deg: 5.0
  m: 0.001

joints:
  joint1:
    offset: 0.0
    step: {sizes: [10, 30], dwell_s: 2.0}
    ramp: {amplitude: 15.0, speed: 2.0, cycles: 1}
  joint2:
    offset: 0.0
    hold: {targets: [-30, -15, 15, 30], dwell_s: 3.0}
    step: {sizes: [10, 30], dwell_s: 2.0}
    ramp: {amplitude: 15.0, speed: 2.0, cycles: 1}
  joint3:
    offset: 0.0
    hold: {targets: [-45, -30, -15, 15, 30, 45], dwell_s: 3.0}
    step: {sizes: [10, 30], dwell_s: 2.0}
    ramp: {amplitude: 15.0, speed: 2.0, cycles: 1}
  joint4:
    offset: 0.0
    hold: {targets: [-60, -30, 30, 60], dwell_s: 3.0}
    step: {sizes: [10, 30], dwell_s: 2.0}
    ramp: {amplitude: 15.0, speed: 2.0, cycles: 1}
  joint5:
    offset: 0.0
    step: {sizes: [10, 30], dwell_s: 2.0}
    ramp: {amplitude: 15.0, speed: 2.0, cycles: 1}
  gripper_left_joint:
    offset: 0.0
    # REAL DIRECTION IS REVERSED vs the URDF (2026-10-24): a larger value CLOSES. Gap 2.0 mm -> 38, 10 -> 27,
    # 16.78 -> 20 mm (closed, mechanical end; above ~17 mm the servo stalls at ~2 A) -> keep commands <= 17 mm
    hold: {targets: [-0.01125, -0.00725, -0.00325, 0.0, 0.00375], dwell_s: 10.0}   # 2.0, 6.0, 10.0, 13.25, 17.0 mm
    step: {sizes: [0.003, 0.0035], dwell_s: 2.0}                                 # 10 mm went to 23.25 mm -> stall
    ramp: {amplitude: 0.0035, speed: 0.002, cycles: 1}                        # ±3.5 mm at 2 mm/s
