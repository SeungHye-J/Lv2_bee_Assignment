# Basket poses for `sag_calib`: the fingertips (tool pointing down) 30 mm above the basket wall top (z = 126.5 mm in
# base_link, walls 35 mm over the slot floor) over 4 slots of the urdf basket_slot_N frames (rows x = -105 / -40 mm,
# cols y = -97.5 / -32.5 mm in base_link). The arm turns joint1 about 130-170 deg to reach behind itself.
#   ros2 run sine_test sag_calib --ros-args -p config:=<this file>
# The far row (slots 0-3, x = -170 mm) is out of reach at this height (IK error > 10 mm), so it is not used.
# IK on urdf/beebot_mesh kinematics (pinocchio): position error < 0.2 mm, joints and +-approach_deg offsets inside the
# URDF limits. NOT checked: collision. The joint-space move from the current pose to the first pose sweeps joint1
# through ~150 deg: start from a high pose (set_center), watch the first move, Ctrl+C stops the arm.
# Measure from `origin_mm` (chassis front edge, centre line, floor): "forward left up" in mm. The slots are behind the
# front edge, so forward is NEGATIVE (e.g. slot_4: -174 -98 167). tip_mm is the expected value in that frame.
move_s: 4.0
settle_s: 1.5
avg_s: 1.0
approach_deg: 2.0   # joint2-4 come from +/- this far from the pose (reverses the direction of travel; 6 deg dropped the tip 15-50 mm into the shelf in the sim check)
origin_mm: [69.0, 0.0, -10.0]

poses:
  slot_4:  {joint1: -147.5, joint2: 16.1,  joint3: -25.4, joint4: 99.3, joint5: 32.5,  tip_mm: [-174, -98, 167]}
  slot_5:  {joint1: -168.1, joint2: 3.8,   joint3: -8.6,  joint4: 94.7, joint5: 11.9,  tip_mm: [-174, -33, 167]}
  slot_8:  {joint1: -132.1, joint2: -7.5,  joint3: 4.5,   joint4: 92.9, joint5: -42.0, tip_mm: [-109, -98, 167]}
  slot_9:  {joint1: -159.8, joint2: -24.0, joint3: 19.6,  joint4: 94.4, joint5: 20.2,  tip_mm: [-109, -33, 167]}
  # held out of the fit (use: val), 45 mm above the wall top
  val_basket_high: {joint1: 167.9, joint2: 4.9, joint3: -16.9, joint4: 102.0, joint5: -12.1, tip_mm: [-174, 33, 182], use: val}
