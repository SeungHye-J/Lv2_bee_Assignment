# Lv2 module6 테스트베드 — ROS 2 Lyrical on Ubuntu 26.04
# 사용법: docker/ 디렉토리 안에서 실행
#   docker compose build
#   docker compose up -d && docker compose exec lyrical bash
#   (컨테이너 안) test-all            # push 전 로컬 게이트 (CI와 같은 검사)
#   (컨테이너 안) test-faker 0        # 더미로 전체 흐름 띄워 두기 (Ctrl+C로 종료)
# 기준: volumes 상대경로는 이 compose 파일 위치(docker/) 기준.
services:
  lyrical:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lv2-module6:testbed
    container_name: lv2_module6
    working_dir: /ws
    # 같은 LAN의 다른 팀 스택(xsting 등)과 DDS가 섞이지 않게 도메인 분리 (기본 0이면 /robot_description 같은 토픽을 남의 로봇이 가로챔)
    environment:
      - ROS_DOMAIN_ID=6
      # 컨테이너 안 DDS는 전부 자기 자신 — loopback 고정 (LAN 멀티캐스트·외부 DDS 간섭 원천 차단)
      - ROS_LOCALHOST_ONLY=1
    volumes:
      # ROS 2 워크스페이스 전체를 마운트 (src + urdf + build/install/log — 호스트에서 빌드 결과·로그 직접 확인용)
      # 주의: 컨테이너(root)가 만든 build/install/log 파일은 호스트에서 root 소유라 읽기만 됨.
      # 지우거나 고칠 땐 docker compose exec -u root ... chown -R 1000:1000 /ws/build /ws/install /ws/log
      - ../lv2_module6/ros2_ws:/ws
      # OpenCR 펌웨어 스케치 + 컴파일 결과(build/, gitignore) — 컨테이너가 빌드 산출물을 쓰므로 rw
      - ../lv2_module6/firmware:/firmware
      # 호스트 공유 폴더 (휘발성, gitignore) — 통제실·시뮬레이션과 파일로 주고받음
      #   output/topic/<토픽>/echo·message·image.jpg ← monitor(message·image) + test-logger(echo)
      #   topic/<토픽>/info · topic/list · node/<노드>/info · node/list · pkg/<패키지>/prefix · pkg/<패키지>/executables · pkg/list ← test-logger
      #   input/topic/<토픽>/message       → input_manager (파일 → 토픽)
      #   input/hardware/camera/<카메라>.png → fake_camera 장면
      #   input/hardware/serial · output/hardware/serial            가상 시리얼 ↔ 파일 (OpenCR 흉내)
      - ../lv2_module6/debug:/debug
    stdin_open: true
    tty: true
    network_mode: host
    command: bash
