# Lv2 module6 테스트베드 — ROS 2 Lyrical on Ubuntu 26.04
# 사용법: docker/ 디렉토리 안에서 실행
#   docker compose build
#   docker compose up -d && docker compose exec lyrical bash
#   (컨테이너 안) test-all            # push 전 로컬 게이트 (CI와 같은 검사)
#   (컨테이너 안) test-faker 0        # 더미로 전체 흐름 띄워 두기 (Ctrl+C로 종료)
# 기준: volumes 상대경로는 이 compose 파일 위치(docker/) 기준.
services:
  lyrical:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lv2-module6:testbed
    container_name: lv2_module6
    working_dir: /ws
    volumes:
      # ROS 2 워크스페이스 (소스만 마운트, build/install/log은 컨테이너 내부)
      - ../lv2_module6/ros2_ws/src:/ws/src
      # 로봇 모델 (ros_system이 ../../../urdf 로 찾는다 → /ws/src/ros_system 기준 /urdf)
      - ../lv2_module6/urdf:/urdf:ro
      # OpenCR 펌웨어 스케치 (arduino-cli compile이 스케치 폴더에 빌드 산출물을 쓰므로 rw)
      - ../lv2_module6/firmware:/ws/firmware
      # 호스트 공유 폴더 (휘발성, gitignore) — 통제실·시뮬레이션과 파일로 주고받음
      #   topic/<토픽>/message·image.jpg  ← monitor_manager (토픽 → 파일), test-logger echo
      #   input/<토픽>/message            → input_manager (파일 → 토픽)
      #   input-live/<카메라>.png         → fake_camera 장면
      #   serial-in · serial-out           가상 시리얼 ↔ 파일 (OpenCR 흉내), firmware/ 컴파일 결과
      - ../lv2_module6/debug:/ws/debug
    stdin_open: true
    tty: true
    network_mode: host
    command: bash
